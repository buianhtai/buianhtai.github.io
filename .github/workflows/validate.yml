name: Validate Astro build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a PR needs expensive browser checks.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install D2 (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          D2_VERSION="v0.9.0"
          ARCHIVE="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/${ARCHIVE}" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          make -sC "$RUNNER_TEMP/d2-${D2_VERSION}" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" version
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build

      - name: Assert full-text search index exists
        run: test -s dist/pagefind/pagefind.js

      - name: Validate EventCatalog Community build and GitHub Pages subpath
        run: |
          node scripts/sync-architecture-catalog.mjs
          npm install --prefix architecture-catalog --no-audit --no-fund
          npm run build --prefix architecture-catalog
          test -s architecture-catalog/dist/index.html
          mkdir -p dist/architecture
          cp -R architecture-catalog/dist/. dist/architecture/
          test -s dist/architecture/index.html
          test -s dist/pagefind/pagefind.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run visual checks and capture screenshots
        timeout-minutes: 2
        run: node scripts/editorial-visual-check.mjs
      - name: Upload editorial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-v3-screenshots
          path: artifacts/editorial/
          if-no-files-found: warn
