name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install D2 (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          D2_VERSION="v0.9.0"
          ARCHIVE="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/${ARCHIVE}" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          make -sC "$RUNNER_TEMP/d2-${D2_VERSION}" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Astro blog
        run: |
          npm ci
          npm run build

      - name: Build EventCatalog Community architecture portal
        run: |
          node scripts/sync-architecture-catalog.mjs
          npm install --prefix architecture-catalog --no-audit --no-fund
          node scripts/validate-architecture-catalog.mjs
          npm run build --prefix architecture-catalog
          test -s architecture-catalog/dist/index.html
          mkdir -p dist/architecture
          cp -R architecture-catalog/dist/. dist/architecture/
          test -s dist/architecture/index.html
          test -s dist/architecture/atlas/index.html
          grep -q 'ARCHITECTURE ATLAS' dist/architecture/atlas/index.html || {
            echo "::error::Architecture Atlas preview missing from combined site"
            exit 1
          }
          grep -q 'Launch Architecture Atlas' architecture-catalog/dist/index.html || {
            echo "::error::Architecture portal missing Atlas navigation"
            exit 1
          }
          for flow in ExplicitAgentRun AgentRunRecovery ToolExecution RoutedAgentRun AgentConfigurationLifecycle SupportEmailIntake ApprovalGatedExternalJob DelegatedAgentRun; do
            find architecture-catalog/dist -type f -path "*/docs/flows/$flow/0.1.0/index.html" | grep -q . || {
              echo "::error::Missing EventCatalog flow: $flow"
              exit 1
            }
          done
          for command in StartAgentRun InvokeTool PublishAgentVersion TriggerAgentRun RequestApproval DelegateAgentRun; do
            find architecture-catalog/dist -type f -path "*/docs/commands/$command/0.1.0/index.html" | grep -q . || {
              echo "::error::Missing EventCatalog command: $command"
              exit 1
            }
          done
          find architecture-catalog/dist -type f -path "*/docs/queries/GetRunStatus/0.1.0/index.html" | grep -q . || {
            echo "::error::Missing EventCatalog query: GetRunStatus"
            exit 1
          }
          test -s architecture-catalog/teams/architecture-stewards.mdx
          test -s architecture-catalog/services/PlatformAPI/openapi.json
          test -s architecture-catalog/services/RunService/asyncapi.json
          for adr in adr-001-workflow-engine adr-002-runtime-adapter adr-003-tool-security adr-004-agent-routing; do
            find architecture-catalog/dist -type f -path "*/docs/adrs/$adr/0.1.0/index.html" | grep -q . || {
              echo "::error::Missing native EventCatalog ADR: $adr"
              exit 1
            }
          done
          for diagram in ExecutiveOverview ArchitectureOverview C4SystemContext C4Containers C4ControlPlane C4ExecutionPlane C4FrontendComponents C4APIComponents C4IntegrationComponents C4Deployment IntegrationAdapters RunLifecycleSequence ToolInvocationSequence AgentLifecycle AgentRunStateMachine EventDataFlow TrustBoundaries ResilienceOverview StateAndDataModel; do
            find architecture-catalog/dist -type f -path "*/diagrams/$diagram/0.1.0/index.html" | grep -q . || {
              echo "::error::Missing published architecture diagram: $diagram"
              exit 1
            }
          done
          find architecture-catalog/dist -type f -path "*/diagrams/ArchitectureOverview/0.1.0/embed/index.html" | grep -q . || {
            echo "::error::Missing homepage architecture diagram embed"
            exit 1
          }
          find architecture-catalog/dist -type f -path "*/diagrams/ExecutiveOverview/0.1.0/embed/index.html" | grep -q . || {
            echo "::error::L0 homepage overview embed missing"
            exit 1
          }
          grep -q 'Architecture, from one-minute overview to implementation details' architecture-catalog/dist/index.html || {
            echo "::error::Homepage missing progressive L0-L4 guide"
            exit 1
          }
          grep -q 'C4SystemContext' architecture-catalog/dist/index.html || {
            echo "::error::Homepage missing C4 navigation"
            exit 1
          }
          for system in AgentExecutionPlatform IdentityAndAccess ModelProviders IntegrationProviders TriggerSources; do
            test -s architecture-catalog/systems/$system/index.mdx || {
              echo "::error::Missing native EventCatalog system: $system"
              exit 1
            }
          done
          for dataStore in AgentConfigurationStore RunEventStore ArtifactStore; do
            find architecture-catalog/dist -type f -path "*/docs/containers/$dataStore/0.1.0/index.html" | grep -q . || {
              echo "::error::Missing native data store: $dataStore"
              exit 1
            }
          done
          grep -q 'system-context-map-portal' architecture-catalog/dist/index.html || {
            echo "::error::Homepage missing native SystemContextMap component"
            exit 1
          }
          grep -q 'data-architecture-graph-portal' architecture-catalog/dist/index.html || {
            echo "::error::Homepage missing native ArchitectureGraph component"
            exit 1
          }
          test -s architecture-catalog/systems/AgentExecutionPlatform/index.mdx
          test -s architecture-catalog/domains/AgentPlatform/entities/AgentVersion/index.mdx
          test -s architecture-catalog/pages/homepage.astro
          grep -q 'Configurable agents, explained' architecture-catalog/dist/index.html || {
            echo "::error::Custom EventCatalog homepage did not render"
            exit 1
          }
          find architecture-catalog/dist -type f -path "*/systems/AgentExecutionPlatform/0.1.0/index.html" | grep -q . || {
            echo "::error::Missing EventCatalog system page: AgentExecutionPlatform"
            exit 1
          }
          find architecture-catalog/dist -type f -path "*/docs/entities/AgentRun/0.1.0/index.html" | grep -q . || {
            echo "::error::Missing EventCatalog entity page: AgentRun"
            exit 1
          }

      - name: Checkout pinned Archify renderer (v3.0.1)
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          ref: 2ab3cae7ac2c2a55d7386ca789d03c4fcd31816c
          path: .vendor/archify
          persist-credentials: false
      - name: Install pinned Archify renderer dependencies
        run: npm ci --prefix .vendor/archify/archify --no-audit --no-fund
      - name: Build enterprise Archify diagram pilot
        run: |
          node scripts/build-archify-pilot.mjs
          for name in agent-platform-container-map agent-run-sequence approval-swimlane; do
            test -s "dist/architecture/showcase/${name}.html"
          done

      - name: Generate editorial SVG and editable diagrams.net views
        run: |
          node scripts/build-editorial-diagrams.mjs
          for id in executive containers; do
            test -s "dist/architecture/showcase/editorial-${id}.svg"
            test -s "dist/architecture/showcase/editorial-${id}.drawio"
          done
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ("executive","containers"):
              base=Path("dist/architecture/showcase/editorial-"+name)
              ET.parse(str(base)+".svg")
              root=ET.parse(str(base)+".drawio").getroot()
              assert root.tag == "mxfile"
              cells=root.findall(".//mxCell")
              assert len(cells) > (12 if name=="executive" else 23)
              if name=="containers":
                  ids={c.get("id") for c in cells}
                  assert {"fe","be","workers","gateways","data","external"}.issubset(ids)
          print("Editorial SVG/XML and editable draw.io boundary checks passed.")
          PY

      - name: Upload combined site as one GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
