name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install D2 (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          D2_VERSION="v0.9.0"
          ARCHIVE="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/${ARCHIVE}" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          make -sC "$RUNNER_TEMP/d2-${D2_VERSION}" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" version

      - name: Install, build, and upload
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
