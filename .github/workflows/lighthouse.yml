name: Lighthouse Quality Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install D2 (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          D2_VERSION="v0.9.0"
          ARCHIVE="d2-$D2_VERSION-linux-amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/d2lang/d2/releases/download/$D2_VERSION/$ARCHIVE" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          make -sC "$RUNNER_TEMP/d2-$D2_VERSION" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site with search and social previews
        run: npm run build
      - name: Validate SEO routes and generated images
        run: |
          test -s dist/robots.txt
          test -s dist/404.html
          test -s dist/en/about/index.html
          test -s dist/vi/about/index.html
          test -s dist/og/site.png
          test -s dist/sitemap-index.xml
      - name: Lighthouse CI audit
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-lighthouse-audits
          path: artifacts/lighthouse/
          if-no-files-found: warn
