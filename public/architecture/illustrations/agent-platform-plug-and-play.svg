<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1040" role="img" aria-labelledby="title desc"><title id="title">Plug-and-play Agent Platform illustrated product architecture</title><desc id="desc">An agent author assembles approved models skills tools knowledge triggers and collaborators; an authorized publisher pins a version; control plane and workers execute securely through gateways with durable events.</desc><rect x="0" y="0" width="1740" height="1040" rx="0" fill="#F4F7FC" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1740" height="172" rx="0" fill="#132B48" stroke="none" stroke-width="1.5"/><text x="66" y="45" fill="#A9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">REFERENCE ARCHITECTURE  /  PROPOSED DESIGN</text><text x="65" y="106" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" >Build agents by configuration.</text><text x="67" y="145" fill="#C9D7E9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" >Extend capabilities through reviewed adapters — not edits to the core agent loop.</text><rect x="1425" y="49" width="250" height="57" rx="29" fill="#233F61" stroke="#4D7196" stroke-width="1.5"/><text x="1550" y="85" fill="#B8EAE4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">PLUG + PLAY</text><text x="70" y="228" fill="#2672D9" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">01   ASSEMBLE</text><text x="70" y="271" fill="#132B48" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" >Choose from the eligible catalog</text><rect x="70" y="301" width="488" height="99" rx="16" fill="#FFFFFF" stroke="#D8E2F0" stroke-width="1.5"/><rect x="90" y="321" width="58" height="58" rx="14" fill="#7C55CB16" stroke="#7C55CB42" stroke-width="1.5"/><path d="M114 337c-12 -1 -14 13 -7 18 -3 11 11 16 16 7V337m2 0c10 