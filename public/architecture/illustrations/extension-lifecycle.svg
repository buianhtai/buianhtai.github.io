<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="690" viewBox="0 0 1740 690" role="img" aria-labelledby="title desc"><title id="title">Extensible Agent Platform: Adapter Review and Binding Lifecycle</title><desc id="desc">Four separate records: adapter package, workspace adapter instance, published capability and scoped agent binding; then publishing and policy-enforced run execution.</desc><rect x="0" y="0" width="1740" height="690" rx="0" fill="#F4F7FC" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1740" height="151" rx="0" fill="#132B48" stroke="none" stroke-width="1.5"/><text x="66" y="47" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#A9D5FF" font-weight="700" letter-spacing="2">PLUG-IN LIFECYCLE  /  THREE ACTORS, ONE GOVERNED PROCESS</text><text x="65" y="107" font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#FFFFFF" font-weight="700" >Add capabilities without rewriting the agent.</text><rect x="65" y="213" width="360" height="282" rx="18" fill="#fff" stroke="#D8E2F0" stroke-width="1.5"/><rect x="85" y="233" width="48" height="49" rx="13" fill="#2672D9" stroke="#2672D9" stroke-width="1.5"/><text x="108" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="144" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2672D9" font-weight="700" letter-spacing="1.5">PACKAGE</text><rect x="92" y="307" width="64" height="64" rx="14" fill="#2672D915" stroke="#2672D944" stroke-width="1.5"/><path d="M24 17l18 10v21L24 58 6 48V27z" transform="translate(100,315)" stroke="#2672D9" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="172" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="600" >Adapter developer</text><text x="92" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#132B48" font-weight="700" >Implement typed SPI</text><text x="92" y="447" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="500" >Version + provenance</text><path d="M428 355h48m-10 -8 10 8-10 8" stroke="#2672D9" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="482" y="213" width="360" height="282" rx="18" fill="#fff" stroke="#D8E2F0" stroke-width="1.5"/><rect x="502" y="233" width="48" height="49" rx="13" fill="#7C55CB" stroke="#7C55CB" stroke-width="1.5"/><text x="525" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="561" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7C55CB" font-weight="700" letter-spacing="1.5">INSTANCE</text><rect x="509" y="307" width="64" height="64" rx="14" fill="#7C55CB15" stroke="#7C55CB44" stroke-width="1.5"/><path d="M24 12l19 9v14q0 15-19 24Q5 50 5 35V21z" transform="translate(517,315)" stroke="#7C55CB" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="589" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="600" >Operator / Admin</text><text x="509" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#132B48" font-weight="700" >Review + configure</text><text x="509" y="447" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="500" >Secret refs + health</text><path d="M845 355h48m-10 -8 10 8-10 8" stroke="#2672D9" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="899" y="213" width="360" height="282" rx="18" fill="#fff" stroke="#D8E2F0" stroke-width="1.5"/><rect x="919" y="233" width="48" height="49" rx="13" fill="#D17A1D" stroke="#D17A1D" stroke-width="1.5"/><text x="942" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="978" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#D17A1D" font-weight="700" letter-spacing="1.5">CAPABILITY</text><rect x="926" y="307" width="64" height="64" rx="14" fill="#D17A1D15" stroke="#D17A1D44" stroke-width="1.5"/><path d="M7 15h34v10H7z M7 31h34v10H7z M7 47h34v10H7z" transform="translate(934,315)" stroke="#D17A1D" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1006" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="600" >Catalog owner</text><text x="926" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#132B48" font-weight="700" >Publish safe operations</text><text x="926" y="447" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="500" >Schema + risk class</text><path d="M1262 355h48m-10 -8 10 8-10 8" stroke="#2672D9" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="1316" y="213" width="360" height="282" rx="18" fill="#fff" stroke="#D8E2F0" stroke-width="1.5"/><rect x="1336" y="233" width="48" height="49" rx="13" fill="#008C83" stroke="#008C83" stroke-width="1.5"/><text x="1359" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1395" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#008C83" font-weight="700" letter-spacing="1.5">BINDING</text><rect x="1343" y="307" width="64" height="64" rx="14" fill="#008C8315" stroke="#008C8344" stroke-width="1.5"/><path d="M7 19h34v36H7z M15 28h18 M15 37h18 M15 46h12" transform="translate(1351,315)" stroke="#008C83" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="1423" y="344" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="600" >Agent author</text><text x="1343" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#132B48" font-weight="700" >Select eligible tools</text><text x="1343" y="447" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52657B" font-weight="500" >Narrow granted scope</text><rect x="65" y="539" width="1612" height="99" rx="16" fill="#E0F2EE" stroke="#8ACBBE" stroke-width="1.5"/><rect x="86" y="558" width="58" height="60" rx="13" fill="#C3E7E0" stroke="#8ACBBE" stroke-width="1.5"/><path d="M98 587l12 12 21-27" stroke="#008C83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="162" y="576" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#008C83" font-weight="700" >PUBLISH PINNED AGENT VERSION</text><text x="162" y="610" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#132B48" font-weight="600" >RUN  →  recheck permissions  →  invoke typed adapter  →  persist audited outcome and result</text><text x="72" y="670" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52657B" font-weight="700" letter-spacing="0.7">NO ARBITRARY SHELL / URL   •   NEW PORT TYPES STILL REQUIRE ENGINEERING   •   PROPOSED DESIGN</text></svg>