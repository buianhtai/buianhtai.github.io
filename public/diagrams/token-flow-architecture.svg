<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">How Each Tool Intercepts Token Flow</text>
  <text x="480" y="54" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Same command, three different paths — what enters the LLM context window</text>

  <!-- ===== ROW 1: RTK ===== -->
  <text x="30" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">RTK — Shell Hook (transparent compression)</text>

  <!-- LLM box -->
  <rect x="30" y="100" width="100" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="80" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e40af">LLM</text>
  <text x="80" y="134" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#3b82f6">calls bash</text>

  <!-- arrow LLM -> Hook -->
  <line x1="130" y1="122" x2="190" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="160" y="116" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280">git status</text>

  <!-- Hook box -->
  <rect x="192" y="100" width="120" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="252" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Shell Hook</text>
  <text x="252" y="134" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#3b82f6">rewrites → rtk git</text>

  <!-- arrow Hook -> git -->
  <line x1="312" y1="122" x2="370" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- git box -->
  <rect x="372" y="100" width="90" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="417" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#374151">git</text>
  <text x="417" y="134" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af">raw output</text>

  <!-- arrow git -> RTK filter -->
  <line x1="462" y1="122" x2="518" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="490" y="116" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#dc2626">800 tok raw</text>

  <!-- RTK filter box -->
  <rect x="520" y="100" width="130" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="585" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e40af">RTK Filter</text>
  <text x="585" y="134" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#3b82f6">90+ patterns</text>

  <!-- arrow filter -> context -->
  <line x1="650" y1="122" x2="708" y2="122" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="679" y="116" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#16a34a">~150 tok</text>

  <!-- Context window -->
  <rect x="710" y="100" width="130" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="775" y="118" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">Context</text>
  <text x="775" y="134" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#22c55e">~80% saved</text>

  <!-- ===== ROW 2: lean-ctx ===== -->
  <text x="30" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d">lean-ctx — MCP Server (compress + cache)</text>

  <!-- LLM box -->
  <rect x="30" y="200" width="100" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="80" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d">LLM</text>
  <text x="80" y="234" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#22c55e">ctx_read</text>

  <!-- arrow -->
  <line x1="130" y1="222" x2="190" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- lean-ctx MCP box -->
  <rect x="192" y="200" width="140" height="44" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="262" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d">lean-ctx MCP</text>
  <text x="262" y="234" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#22c55e">46 tools · 10 read modes</text>

  <!-- Cache box (below lean-ctx) -->
  <rect x="222" y="256" width="80" height="32" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="262" y="270" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#a16207">Hash Cache</text>
  <text x="262" y="282" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#a16207">13 tok re-read</text>
  <line x1="262" y1="244" x2="262" y2="256" stroke="#fde047" stroke-width="1.5"/>

  <!-- arrow to file -->
  <line x1="332" y1="222" x2="390" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- File box -->
  <rect x="392" y="200" width="90" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="437" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#374151">File</text>
  <text x="437" y="234" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af">2000 tok raw</text>

  <!-- arrow file -> compress -->
  <line x1="482" y1="222" x2="538" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Compress box -->
  <rect x="540" y="200" width="130" height="44" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="605" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d">map mode</text>
  <text x="605" y="234" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#22c55e">tree-sitter AST</text>

  <!-- arrow to context -->
  <line x1="670" y1="222" x2="708" y2="222" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="689" y="216" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#16a34a">~30 tok</text>

  <!-- Context window -->
  <rect x="710" y="200" width="130" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="775" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">Context</text>
  <text x="775" y="234" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#22c55e">99% saved (cached)</text>

  <!-- ===== ROW 3: context-mode ===== -->
  <text x="30" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7e22ce">context-mode — Sandbox Execution (you control output)</text>

  <!-- LLM box -->
  <rect x="30" y="330" width="100" height="44" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="80" y="348" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7e22ce">LLM</text>
  <text x="80" y="364" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#a855f7">ctx_execute</text>

  <!-- arrow -->
  <line x1="130" y1="352" x2="190" y2="352" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Sandbox box -->
  <rect x="192" y="318" width="140" height="70" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="262" y="340" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7e22ce">Sandbox</text>
  <text x="262" y="356" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#9333ea">subprocess runs code</text>
  <text x="262" y="370" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#9333ea">raw data stays here</text>
  <text x="262" y="382" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#a855f7">→ console.log(summary)</text>

  <!-- Raw output stays in sandbox (shows blocked) -->
  <rect x="370" y="330" width="120" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="430" y="348" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626">Raw output</text>
  <text x="430" y="364" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#ef4444">stays in subprocess</text>
  <line x1="332" y1="352" x2="370" y2="352" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- X mark on raw output path to context -->
  <line x1="490" y1="352" x2="540" y2="352" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="515" y="347" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">✕</text>

  <!-- Only stdout goes to context -->
  <path d="M 262 388 Q 262 430 540 430 L 708 430" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arr-purple)"/>
  <text x="490" y="424" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" fill="#9333ea">only your console.log()</text>

  <!-- Context window -->
  <rect x="710" y="408" width="130" height="44" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="775" y="426" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7e22ce">Context</text>
  <text x="775" y="442" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#a855f7">unbounded savings</text>

  <!-- Legend -->
  <rect x="30" y="492" width="900" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="512" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#374151">Key insight</text>
  <text x="50" y="530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">RTK/lean-ctx: full_output → compress → smaller_output → context</text>
  <text x="50" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">context-mode: full_output → stays in subprocess → your console.log() → context</text>
  <text x="50" y="556" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#7e22ce">             With context-mode, raw data NEVER enters context — you decide exactly what to print.</text>
</svg>
