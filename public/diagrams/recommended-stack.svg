<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#9ca3af"/>
    </marker>
    <marker id="arr-right-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-right-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-right-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Recommended Token Management Stack</text>
  <text x="480" y="56" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Three complementary layers — install all three, they don't conflict</text>

  <!-- Layer 1: RTK - Shell layer -->
  <rect x="40" y="80" width="880" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="40" y="80" width="8" height="96" rx="4" fill="#2563eb"/>
  <text x="68" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Layer 1 — RTK</text>
  <text x="68" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">Shell hook: transparently rewrites git, ls, grep, cargo test → rtk equivalents. Zero LLM behavior change.</text>
  <text x="68" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Install: brew install rtk &amp;&amp; rtk init -g</text>
  <!-- Badges -->
  <rect x="680" y="93" width="80" height="22" rx="4" fill="#dbeafe"/>
  <text x="720" y="108" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">60–90% savings</text>
  <rect x="768" y="93" width="130" height="22" rx="4" fill="#dcfce7"/>
  <text x="833" y="108" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#16a34a">zero friction · 36.2k ★</text>

  <!-- Use case tags -->
  <rect x="68" y="155" width="90" height="18" rx="4" fill="#dbeafe"/>
  <text x="113" y="167" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">git operations</text>
  <rect x="164" y="155" width="80" height="18" rx="4" fill="#dbeafe"/>
  <text x="204" y="167" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">test runners</text>
  <rect x="250" y="155" width="80" height="18" rx="4" fill="#dbeafe"/>
  <text x="290" y="167" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">ls · find · grep</text>
  <rect x="336" y="155" width="80" height="18" rx="4" fill="#dbeafe"/>
  <text x="376" y="167" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#1e40af">docker · kubectl</text>

  <!-- Arrow down -->
  <line x1="480" y1="176" x2="480" y2="196" stroke="#d1d5db" stroke-width="2" marker-end="url(#arr-down)"/>

  <!-- Layer 2: context-mode - Analysis layer -->
  <rect x="40" y="200" width="880" height="96" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="40" y="200" width="8" height="96" rx="4" fill="#9333ea"/>
  <text x="68" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7e22ce">Layer 2 — context-mode</text>
  <text x="68" y="248" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b21a8">Sandbox MCP: large output, web fetches, log analysis. You write extraction code — only your summary enters context.</text>
  <text x="68" y="268" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Install: add to mcp config as "context-mode" server</text>
  <!-- Badges -->
  <rect x="654" y="213" width="100" height="22" rx="4" fill="#ede9fe"/>
  <text x="704" y="228" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#7e22ce">90–99%+ savings</text>
  <rect x="760" y="213" width="138" height="22" rx="4" fill="#fef9c3"/>
  <text x="829" y="228" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#a16207">you control the output</text>

  <!-- Use case tags -->
  <rect x="68" y="275" width="80" height="18" rx="4" fill="#ede9fe"/>
  <text x="108" y="287" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7e22ce">web research</text>
  <rect x="154" y="275" width="70" height="18" rx="4" fill="#ede9fe"/>
  <text x="189" y="287" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7e22ce">log analysis</text>
  <rect x="230" y="275" width="90" height="18" rx="4" fill="#ede9fe"/>
  <text x="275" y="287" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7e22ce">large file analysis</text>
  <rect x="326" y="275" width="80" height="18" rx="4" fill="#ede9fe"/>
  <text x="366" y="287" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7e22ce">data extraction</text>
  <rect x="412" y="275" width="100" height="18" rx="4" fill="#ede9fe"/>
  <text x="462" y="287" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#7e22ce">batch_execute 30 cmds</text>

  <!-- Arrow down -->
  <line x1="480" y1="296" x2="480" y2="316" stroke="#d1d5db" stroke-width="2" marker-end="url(#arr-down)"/>

  <!-- Layer 3: Native tools - Editing layer -->
  <rect x="40" y="320" width="880" height="80" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="40" y="320" width="8" height="80" rx="4" fill="#6b7280"/>
  <text x="68" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">Layer 3 — Native Read/Edit tools</text>
  <text x="68" y="368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">When you need to edit a file, you need the full content in context. Use native Read. Don't over-optimize here.</text>
  <!-- Tags -->
  <rect x="68" y="376" width="100" height="18" rx="4" fill="#f3f4f6"/>
  <text x="118" y="388" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">file editing (full read)</text>
  <rect x="174" y="376" width="120" height="18" rx="4" fill="#f3f4f6"/>
  <text x="234" y="388" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">small targeted file reads</text>

  <!-- Decision guide box -->
  <rect x="40" y="418" width="880" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="60" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c2410c">Decision rule:</text>
  <text x="168" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#7c2d12">shell command → RTK   |   large output / web / analysis → context-mode   |   editing files → native Read</text>
  <text x="60" y="456" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">lean-ctx is additive if you want file read caching across repeated sessions — but RTK + context-mode already covers the critical 95%.</text>
</svg>
