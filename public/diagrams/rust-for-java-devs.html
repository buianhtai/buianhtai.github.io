<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust for Java Developers — Visual Guide</title>
  <style>
    :root { --bg:#0f1117; --panel:#171b25; --panel2:#1d2330; --ink:#e2e8f0; --muted:#9aa7bb; --line:#465269; --cyan:#67e8f9; --green:#4ade80; --amber:#fbbf24; --rose:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 85% 0%, #19263a 0, transparent 35%), var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width:min(1120px, calc(100% - 36px)); margin:0 auto; padding:64px 0 80px; }
    header { margin-bottom:42px; max-width:760px; }
    .eyebrow { color:var(--cyan); font:700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 9px; font-size:clamp(30px, 5vw, 52px); line-height:1.05; letter-spacing:-.045em; }
    header p { margin:0; color:var(--muted); font-size:18px; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:26px; }
    figure { margin:0; background:linear-gradient(145deg, rgba(29,35,48,.94), rgba(20,24,34,.94)); border:1px solid #2b3548; border-radius:18px; padding:23px 23px 19px; box-shadow:0 16px 45px rgba(0,0,0,.18); overflow:hidden; }
    figure.wide { grid-column:1/-1; }
    figcaption { color:#c7d2e3; font-size:14px; margin-top:14px; }
    figcaption strong { color:var(--cyan); }
    .kicker { color:var(--muted); font:700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.1em; text-transform:uppercase; }
    h2 { font-size:20px; margin:6px 0 17px; letter-spacing:-.02em; }
    svg { display:block; width:100%; height:auto; min-height:260px; }
    .node { fill:var(--panel2); stroke:#536179; stroke-width:1.5; }
    .node-owned { stroke:var(--cyan); }
    .node-moved { stroke:var(--rose); }
    .node-borrow { stroke:#a78bfa; }
    .node-drop { stroke:#64748b; }
    .svg-title { fill:var(--ink); font:700 14px ui-sans-serif,system-ui,sans-serif; }
    .svg-sub { fill:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .edge { stroke:var(--line); stroke-width:1.7; fill:none; marker-end:url(#arrow); }
    .edge-cyan { stroke:var(--cyan); marker-end:url(#arrow-cyan); }
    .edge-rose { stroke:var(--rose); marker-end:url(#arrow-rose); }
    .edge-dash { stroke:var(--amber); stroke-dasharray:6 5; fill:none; marker-end:url(#arrow-amber); }
    .edge-label { fill:#bbc6d7; font:11px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .yes { fill:var(--green); font-weight:700; } .no { fill:var(--rose); font-weight:700; }
    .map-label { fill:#78869e; font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .map-left { fill:#d6deeb; font:13px ui-sans-serif,system-ui,sans-serif; }
    .map-right { fill:#b9f2f7; font:13px ui-sans-serif,system-ui,sans-serif; }
    .map-note { fill:var(--muted); font:10px ui-sans-serif,system-ui,sans-serif; }
    .rose-box { fill:rgba(251,113,133,.10); stroke:var(--rose); } .amber-box { fill:rgba(251,191,36,.09); stroke:var(--amber); }
    .arch { fill:#202838; stroke:#516078; stroke-width:1.4; }
    .arch-top { fill:#273747; stroke:var(--cyan); } .arch-domain { fill:#243329; stroke:var(--green); }
    @media (max-width:760px) { main { padding-top:38px; } .grid { grid-template-columns:1fr; } figure.wide { grid-column:auto; } figure { padding:18px 14px 16px; } }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">A field guide for JVM minds</div><h1>Rust for Java Developers — Visual Guide</h1><p>Four diagrams that explain Rust's mental model</p></header>
  <section class="grid">
    <figure>
      <div class="kicker">01 · ownership</div><h2>Ownership is a state machine</h2>
      <svg viewBox="0 0 520 285" role="img" aria-label="Ownership state machine showing owned, moved, cloned, borrowed and dropped states">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#465269"/></marker>
          <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#67e8f9"/></marker>
          <marker id="arrow-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#fb7185"/></marker>
        </defs>
        <path class="edge edge-cyan" data-from="owned" data-to="moved" d="M157 76 H198"/>
        <text class="edge-label" x="178" y="57" text-anchor="middle">let t = s;</text>
        <path class="edge edge-cyan" data-from="moved" data-to="owned-clone" d="M260 105 V142 H427 V111"/>
        <text class="edge-label" x="342" y="135" text-anchor="middle">.clone()</text>
        <rect id="owned" class="node node-owned" x="23" y="48" width="134" height="57" rx="11"/><text class="svg-title" x="90" y="73" text-anchor="middle">Owned</text><text class="svg-sub" x="90" y="91" text-anchor="middle">String s</text>
        <rect id="moved" class="node node-moved" x="198" y="48" width="124" height="57" rx="11"/><text class="svg-title" x="260" y="73" text-anchor="middle">Moved</text><text class="svg-sub" x="260" y="91" text-anchor="middle">s invalid</text>
        <rect id="owned-clone" class="node node-owned" x="364" y="48" width="126" height="63" rx="11"/><text class="svg-title" x="427" y="74" text-anchor="middle">Owned again</text><text class="svg-sub" x="427" y="94" text-anchor="middle">independent copy</text>
        <path class="edge" data-from="owned" data-to="borrowed" d="M90 105 V190"/><text class="edge-label" x="101" y="153">&amp;s</text>
        <rect id="borrowed" class="node node-borrow" x="23" y="190" width="134" height="57" rx="11"/><text class="svg-title" x="90" y="215" text-anchor="middle">Borrowed</text><text class="svg-sub" x="90" y="233" text-anchor="middle">&amp;s</text>
        <path class="edge" data-from="borrowed" data-to="dropped" d="M157 219 H253"/><text class="edge-label" x="205" y="207" text-anchor="middle">end of borrow (scope)</text>
        <rect id="dropped" class="node node-drop" x="253" y="190" width="134" height="57" rx="11"/><text class="svg-title" x="320" y="215" text-anchor="middle">Dropped</text><text class="svg-sub" x="320" y="233" text-anchor="middle">terminal</text>
        <text class="svg-sub" x="23" y="273">Owner cleans up; references never own the value.</text>
      </svg>
      <figcaption><strong>Insight:</strong> assignment transfers ownership; borrowing temporarily lends access without transferring cleanup.</figcaption>
    </figure>

    <figure>
      <div class="kicker">02 · borrowing</div><h2>Borrow checker: choose the access you need</h2>
      <svg viewBox="0 0 520 300" role="img" aria-label="Borrow checker decision flowchart">
        <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#465269"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#fbbf24"/></marker></defs>
        <path class="edge" marker-end="url(#flow-arrow)" d="M260 45 V70"/><path class="edge" marker-end="url(#flow-arrow)" d="M209 111 H115 V151"/><path class="edge" marker-end="url(#flow-arrow)" d="M311 111 H405 V151"/>
        <text class="edge-label yes" x="131" y="104">yes</text><text class="edge-label no" x="368" y="104">no</text>
        <path class="edge" marker-end="url(#flow-arrow)" d="M115 192 V226"/><path class="edge" marker-end="url(#flow-arrow)" d="M405 192 V226"/>
        <path class="edge-dash" d="M354 111 C330 128 293 142 260 166 V226"/><text class="edge-label" x="300" y="145">clone instead?</text>
        <rect class="node" x="166" y="13" width="188" height="40" rx="20"/><text class="svg-title" x="260" y="38" text-anchor="middle">Need access to value?</text>
        <path class="node" d="M260 70 L311 111 L260 152 L209 111Z"/><text class="svg-title" x="260" y="115" text-anchor="middle">Read only?</text>
        <rect class="node" x="34" y="151" width="162" height="41" rx="9"/><text class="svg-title" x="115" y="176" text-anchor="middle">many <tspan fill="#67e8f9">&amp;T</tspan> borrows OK</text>
        <rect class="node" x="324" y="151" width="162" height="41" rx="9"/><text class="svg-title" x="405" y="176" text-anchor="middle">one <tspan fill="#a78bfa">&amp;mut T</tspan> only</text>
        <rect x="34" y="226" width="162" height="41" rx="20" fill="rgba(74,222,128,.12)" stroke="#4ade80"/><text class="svg-title" x="115" y="251" text-anchor="middle" fill="#4ade80">OK · shared reads</text>
        <rect x="179" y="226" width="162" height="41" rx="20" fill="rgba(251,191,36,.11)" stroke="#fbbf24"/><text class="svg-title" x="260" y="251" text-anchor="middle" fill="#fbbf24">clone() · own a copy</text>
        <rect x="324" y="226" width="162" height="41" rx="20" fill="rgba(74,222,128,.12)" stroke="#4ade80"/><text class="svg-title" x="405" y="251" text-anchor="middle" fill="#4ade80">OK · exclusive write</text>
      </svg>
      <figcaption><strong>Insight:</strong> shared reads can coexist, but a mutable borrow must be exclusive for its lifetime.</figcaption>
    </figure>

    <figure class="wide">
      <div class="kicker">03 · translation</div><h2>Java → Rust concept map</h2>
      <svg viewBox="0 0 1040 500" role="img" aria-label="Two-column map from Java concepts to Rust equivalents">
        <defs><marker id="map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#62718a"/></marker></defs>
        <text class="map-label" x="34" y="24">JAVA CONCEPT</text><text class="map-label" x="648" y="24">RUST EQUIVALENT</text>
        <g class="map-left"><text x="34" y="54">class</text><text x="34" y="105">interface</text><text x="34" y="156">inheritance</text><text x="34" y="207">sealed interface + pattern matching</text><text x="34" y="258">checked exceptions</text><text x="34" y="309">null / Optional</text><text x="34" y="360">generics w/ erasure</text><text x="34" y="411">Maven / jar</text><text x="34" y="462">synchronized / ExecutorService</text></g>
        <g class="map-right"><text x="648" y="54">struct + impl block</text><text x="648" y="105">trait</text><text x="648" y="156">composition + traits</text><text x="648" y="207">enum + match (exhaustive)</text><text x="648" y="258">Result&lt;T, E&gt;</text><text x="648" y="309">Option&lt;T&gt;</text><text x="648" y="360">monomorphized generics</text><text x="648" y="411">Cargo / crates.io</text><text x="648" y="462">Mutex&lt;T&gt; + rayon / tokio</text></g>
        <g fill="none" stroke="#62718a" stroke-width="1.2" marker-end="url(#map-arrow)"><path d="M295 49 H618"/><path d="M295 100 H618"/><path d="M295 151 H618"/><path d="M295 202 H618"/><path d="M295 253 H618"/><path d="M295 304 H618"/><path d="M295 355 H618"/><path d="M295 406 H618"/><path d="M295 457 H618"/></g>
        <g class="edge-label"><text x="457" y="44">→</text><text x="457" y="95">≈</text><text x="457" y="146">≠</text><text x="457" y="197">≈</text><text x="457" y="248">≈</text><text x="457" y="299">≈</text><text x="457" y="350">≠</text><text x="457" y="401">→</text><text x="457" y="452">≈</text></g>
        <rect class="rose-box" x="630" y="129" width="377" height="49" rx="8"/><text class="map-note" x="648" y="171">no inheritance — use composition + traits</text>
        <rect class="amber-box" x="630" y="333" width="377" height="49" rx="8"/><text class="map-note" x="648" y="375">no erasure; monomorphized, no runtime reflection</text>
        <rect class="amber-box" x="630" y="435" width="377" height="49" rx="8"/><text class="map-note" x="648" y="477">no locks around blocks — Send/Sync are type-level proofs</text>
        <line x1="610" y1="31" x2="610" y2="480" stroke="#2d3a4d"/>
      </svg>
      <figcaption><strong>Insight:</strong> Rust replaces class hierarchies and runtime guarantees with composition, explicit data, and compile-time proofs.</figcaption>
    </figure>

    <figure class="wide">
      <div class="kicker">04 · architecture</div><h2>A crate workspace makes boundaries visible</h2>
      <svg viewBox="0 0 1040 350" role="img" aria-label="Layered Rust crate architecture diagram">
        <defs><marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#67e8f9"/></marker></defs>
        <rect class="arch arch-top" x="246" y="18" width="548" height="57" rx="12"/><text class="svg-title" x="520" y="43" text-anchor="middle">bin crate · main.rs</text><text class="svg-sub" x="520" y="62" text-anchor="middle">wires the application together</text>
        <path class="edge edge-cyan" marker-end="url(#arch-arrow)" d="M520 75 V96"/>
        <rect class="arch" x="150" y="97" width="740" height="70" rx="12"/><text class="svg-title" x="520" y="124" text-anchor="middle">application / service layer</text><text class="svg-sub" x="520" y="146" text-anchor="middle">traits define ports · business use-cases orchestrate</text>
        <path class="edge edge-cyan" marker-end="url(#arch-arrow)" d="M520 167 V188"/>
        <rect class="arch arch-domain" x="246" y="189" width="548" height="57" rx="12"/><text class="svg-title" x="520" y="214" text-anchor="middle">domain crate</text><text class="svg-sub" x="520" y="233" text-anchor="middle">structs + enums · no I/O</text>
        <path class="edge" d="M520 246 V271"/><text class="edge-label" x="520" y="265" text-anchor="middle">traits = ports, impls = adapters</text>
        <rect class="arch" x="48" y="278" width="260" height="49" rx="10"/><text class="svg-title" x="178" y="299" text-anchor="middle">infra: HTTP client</text><text class="svg-sub" x="178" y="316" text-anchor="middle">adapter implements a port</text>
        <rect class="arch" x="390" y="278" width="260" height="49" rx="10"/><text class="svg-title" x="520" y="299" text-anchor="middle">infra: DB driver</text><text class="svg-sub" x="520" y="316" text-anchor="middle">adapter implements a port</text>
        <rect class="arch" x="732" y="278" width="260" height="49" rx="10"/><text class="svg-title" x="862" y="299" text-anchor="middle">infra: config</text><text class="svg-sub" x="862" y="316" text-anchor="middle">adapter implements a port</text>
      </svg>
      <figcaption><strong>Insight:</strong> Cargo workspace = 1 lockfile, 1 build; keep the domain pure and plug infrastructure in through traits.</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
