{tier:2,ages:'explorer teen adult senior',q:['Mia practiced piano every day and improved. What is a reasonable conclusion?','Mia tập đàn mỗi ngày và tiến bộ. Kết luận nào hợp lý?'],a:[['Practice may have helped','Practice guarantees perfection','Everyone improves equally','The piano got smarter'],['Luyện tập có thể đã giúp','Luyện tập đảm bảo hoàn hảo','Ai cũng tiến bộ như nhau','Đàn piano thông minh hơn']],c:0,why:['Practice may explain the improvement, but this alone cannot prove it caused all the change.','Luyện tập có thể góp phần giúp tiến bộ, nhưng không chứng minh đó là nguyên nhân duy nhất.']},

{tier:4,ages:'adult senior teen',q:['A new feature raises sign-ups, but fewer users stay after a month. What is the best interpretation?','Tính năng mới tăng lượt đăng ký nhưng giảm tỷ lệ ở lại sau một tháng. Nhận định nào tốt nhất?'],a:[['The feature is certainly a success','Sign-ups improved, but long-term value needs investigation','Retention is irrelevant','The feature caused every cancellation'],['Chắc chắn thành công','Đăng ký tăng, nhưng cần đánh giá giá trị dài hạn','Không cần xem tỷ lệ duy trì','Tính năng gây mọi lượt hủy']],c:1,why:['One metric improves while another worsens. Avoid a single-metric conclusion and investigate causes.','Một chỉ số tăng nhưng chỉ số khác giảm. Cần nghiên cứu nguyên nhân thay vì chỉ nhìn một chỉ số.']},
{tier:4,ages:'adult senior teen',q:['A survey finds 85% satisfaction, but only the most active users responded. What is the main weakness?','Khảo sát cho thấy 85% hài lòng, nhưng chỉ người dùng tích cực nhất trả lời. Điểm yếu lớn nhất?'],a:[['The percentage is too round','Selection bias in the sample','Surveys cannot measure opinions','85% means exactly 85 people'],['Tỷ lệ tròn quá','Thiên lệch chọn mẫu','Khảo sát không đo được ý kiến','85% nghĩa là đúng 85 người']],c:1,why:['Active responders may systematically differ from less engaged users, biasing the result.','Người dùng tích cực có thể khác nhóm ít hoạt động, khiến kết quả sai lệch.']},

{tier:1,ages:'sprout explorer',q:['Two people remember an event differently. What is a fair next step?','Hai người nhớ một sự việc khác nhau. Bước tiếp theo công bằng là gì?'],a:[['Hear both stories','Pick the louder person','Flip a coin','Say neither is allowed to speak'],['Lắng nghe cả hai','Tin người nói to hơn','Tung đồng xu','Không cho ai nói']],c:0,why:['Hearing each person helps you understand what happened before judging.','Lắng nghe hai phía giúp hiểu sự việc trước khi đánh giá.']},
{tier:2,ages:'explorer teen adult senior',q:['A video claims a toy never breaks. What should you look for before buying?','Video quảng cáo đồ chơi không bao giờ hỏng. Nên làm gì trước khi mua?'],a:[['Independent reviews and warranty','Just the music in the ad','Number of emojis','The presenter’s hairstyle'],['Đánh giá độc lập và bảo hành','Chỉ nghe nhạc quảng cáo','Đếm biểu tượng cảm xúc','Nhìn kiểu tóc người dẫn']],c:0,why:['Independent evidence and a warranty are more useful than persuasive styling.','Đánh giá độc lập và bảo hành đáng tin hơn hình thức quảng cáo.']},
{tier:2,ages:'explorer teen adult senior',q:['Your school wants longer breaks. What evidence would help decide?','Trường muốn kéo dài giờ giải lao. Dữ liệu nào giúp quyết định?'],a:[['Opinions and effects on learning','Only the loudest voice','The school wall color','A random internet comment'],['Ý kiến và tác động đến việc học','Chỉ nghe người nói to nhất','Màu tường trường','Một bình luận bất kỳ']],c:0,why:['Good decisions consider affected people and likely consequences.','Quyết định tốt cân nhắc người bị ảnh hưởng và hậu quả có thể xảy ra.']},
{tier:3,ages:'teen adult senior',q:['A health claim spreads quickly on social media. What do you do first?','Một thông tin sức khỏe lan nhanh trên mạng. Nên làm gì đầu tiên?'],a:[['Forward it to help others','Check credible independent evidence','Trust it if it has many likes','Assume it is false without checking'],['Chia sẻ ngay','Kiểm tra nguồn độc lập đáng tin','Tin nếu nhiều lượt thích','Cho là sai mà không kiểm tra']],c:1,why:['Popularity is not evidence of accuracy. Verify high-stakes claims with reliable independent sources.','Độ phổ biến không chứng minh chính xác. Thông tin quan trọng cần nguồn độc lập đáng tin.']},
{tier:3,ages:'teen adult senior',q:['A course promises to “double your IQ in 14 days.” Which question is most important?','Khóa học hứa “tăng gấp đôi IQ trong 14 ngày”. Câu hỏi nào quan trọng nhất?'],a:[['Is the logo bright?','Is there independent, controlled evidence?','How many trophies are pictured?','Is the title catchy?'],['Logo có sáng không?','Có nghiên cứu đối chứng độc lập không?','Ảnh có bao nhiêu cúp?','Tiêu đề có hấp dẫn không?']],c:1,why:['Extraordinary causal claims require rigorous, independent evidence—not marketing.','Tuyên bố nhân quả phi thường cần bằng chứng nghiêm ngặt, độc lập — không phải quảng cáo.']},
{tier:4,ages:'teen adult senior',q:['Your team must choose between a faster launch and better reliability. What is the best approach?','Nhóm phải chọn phát hành nhanh hơn hay tăng độ ổn định. Cách tiếp cận nào tốt nhất?'],a:[['Pick speed without discussion','Compare risk, customer impact and rollback options','Always refuse change','Ask only the most senior person'],['Chọn tốc độ ngay','So sánh rủi ro, tác động và phương án rollback','Không bao giờ thay đổi','Chỉ hỏi người cấp cao nhất']],c:1,why:['Explicit trade-offs, impact and reversibility lead to more defensible choices.','Cân nhắc đánh đổi, tác động và khả năng đảo ngược giúp quyết định chắc chắn hơn.']},
{tier:4,ages:'teen adult senior',q:['A chart starts its vertical axis at 95 and shows 95 vs 98. What should you check?','Biểu đồ bắt đầu trục tung từ 95 để so sánh 95 với 98. Cần kiểm tra gì?'],a:[['Whether the scale exaggerates the difference','Whether purple is used','Whether the author is famous','Whether there are too many labels'],['Liệu trục có phóng đại khác biệt','Màu tím có được dùng không','Tác giả có nổi tiếng không','Có quá nhiều nhãn không']],c:0,why:['A truncated axis can make a small absolute change appear very large.','Trục bị cắt có thể khiến chênh lệch nhỏ trông rất lớn.']},
{tier:5,ages:'teen adult senior',q:['An AI answer cites three articles, but all three repeat one original claim. What remains a concern?','Câu trả lời AI trích ba bài, nhưng cả ba cùng lặp lại một nguồn. Điều gì còn đáng lo?'],a:[['Three citations guarantee truth','The evidence is not genuinely independent','The articles must be illegal','AI cannot cite sources'],['Ba trích dẫn luôn đúng','Các bằng chứng không độc lập thực sự','Các bài đó chắc chắn phạm luật','AI không thể trích nguồn']],c:1,why:['Several sources repeating one claim are not the same as multiple independent confirmations.','Nhiều nguồn lặp lại một khẳng định không tương đương nhiều xác nhận độc lập.']}
];

{tier:1,ages:'sprout explorer',q:['A spoon is heavier than a feather. Which could you use to compare them?','Một chiếc thìa nặng hơn một chiếc lông. Có thể dùng gì để so sánh?'],a:[['⚖️ A scale','🎵 A song','🪞 A mirror','🖍️ A crayon'],['⚖️ Cái cân','🎵 Bài hát','🪞 Gương','🖍️ Bút màu']],c:0,why:['A scale can measure or compare weight.','Cái cân có thể đo hoặc so sánh khối lượng.']},
{tier:1,ages:'sprout explorer',q:['Every fish in this picture has fins. This animal has no fins. Can it be one of those fish?','Tất cả cá trong tranh đều có vây. Con này không có vây. Nó có phải một con cá trong tranh?'],a:[['Yes','No','Only if it is big','Only in the dark'],['Có','Không','Chỉ khi nó to','Chỉ trong bóng tối']],c:1,why:['If every fish in this picture has fins, an animal without fins cannot be one of them.','Vì mọi con cá trong tranh đều có vây, con vật không có vây không thể thuộc nhóm đó.']},
{tier:1,ages:'sprout explorer',q:['The ball was on the table. Now it is gone. What should you do first?','Trái bóng đang ở trên bàn nhưng giờ không thấy nữa. Bạn nên làm gì đầu tiên?'],a:[['Check nearby places','Blame a friend','Buy a new table','Pretend it never existed'],['Tìm quanh khu vực','Đổ lỗi cho bạn','Mua bàn mới','Giả vờ không có bóng']],c:0,why:['Checking for evidence is better than guessing or blaming.','Tìm bằng chứng tốt hơn đoán mò hoặc đổ lỗi.']});

{tier:1,ages:'sprout explorer',q:['A toy does not work. What is a helpful first check?','Đồ chơi không hoạt động. Nên kiểm tra gì trước?'],a:[['Check if it is switched on','Throw it away','Blame a friend','Paint it blue'],['Xem đã bật công tắc chưa','Vứt đi ngay','Đổ lỗi cho bạn','Sơn màu xanh']],c:0,why:['A simple check can explain the problem before taking bigger steps.','Kiểm tra đơn giản có thể giúp tìm nguyên nhân trước khi làm việc lớn.']},
{tier:1,ages:'sprout explorer',q:['You are choosing a story to read. What helps you decide?','Bạn muốn chọn một câu chuyện để đọc. Điều gì giúp quyết định?'],a:[['Look at the topic and read a little','Choose only by book weight','Pick the tallest book','Never read the title'],['Xem chủ đề và đọc thử','Chỉ xem sách nặng bao nhiêu','Chọn sách cao nhất','Không đọc tựa sách']],c:0,why:['A preview gives information about whether the story interests you.','Đọc thử giúp biết câu chuyện có hợp sở thích không.']},
{tier:1,ages:'sprout explorer',q:['Someone says every dog is tiny. You see a very large dog. What does that show?','Có người nói chó nào cũng bé. Bạn thấy một con chó rất to. Điều đó cho thấy gì?'],a:[['The claim is not always true','All dogs are tiny','The large dog is invisible','Nobody can observe dogs'],['Khẳng định đó không luôn đúng','Mọi con chó đều bé','Con chó lớn vô hình','Không ai quan sát được chó']],c:0,why:['One clear counterexample disproves a claim about every single case.','Chỉ một phản ví dụ rõ ràng đủ bác bỏ khẳng định “tất cả”.']});
const COLORS=[{en:'RED',vi:'ĐỎ',hex:'#dc4f63'},{en:'BLUE',vi:'XANH DƯƠNG',hex:'#397bd8'},{en:'GREEN',vi:'XANH LÁ',hex:'#169475'},{en:'YELLOW',vi:'VÀNG',hex:'#b78116'}], SHAPES=['●','▲','■','★','◆','♥'];
function id(){return 'p'+Math.random().toString(36).slice(2,11)}
function createProfile(name='Player 1',age='adult'){return{id:id(),name,age,records:[],skillResults:{},levels:{pattern:1,memory:1,logic:1,focus:1,decision:1},settings:{shapeFocus:false},skillAttempts:{}}}
const initial=()=>({version:1,lang:'en',theme:'light',reduceMotion:false,profiles:[createProfile()],activeId:null});
function load(){try{const parsed=JSON.parse(localStorage.getItem(STORE));if(parsed?.version===1&&Array.isArray(parsed.profiles)&&parsed.profiles.length&&parsed.profiles.length<=8){parsed.profiles=parsed.profiles.filter(p=>p&&typeof p.id==='string'&&Array.isArray(p.records)).slice(0,8);if(parsed.profiles.length){parsed.profiles.forEach(p=>{p.records=p.records.slice(-365);p.skillResults=p.skillResults||{};p.levels=p.levels||{};p.settings=p.settings||{};p.skillAttempts=p.skillAttempts||{}});return parsed}}}catch{}return initial()}
let data=load();if(!data.activeId||!data.profiles.some(p=>p.id===data.activeId))data.activeId=data.profiles[0].id;
let page='dashboard',run=null,roundTimer=null,logicSeen=new Set(),decisionSeen=new Set(),pendingMessage='';
const lang=()=>data.lang==='vi'?'vi':'en';const T=(k)=>W[lang()][k]||k;const txt=(en,vi)=>lang()==='vi'?vi:en;
const p=()=>data.profiles.find(v=>v.id===data.activeId)||data.profiles[0];const skillName=(id)=>GAME[id][lang()];
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function dayKey(d=new Date()){const year=d.getFullYear(),month=String(d.getMonth()+1).padStart(2,'0'),date=String(d.getDate()).padStart(2,'0');return `${year}-${month}-${date}`}
function streak(){const dates=new Set(p().records.filter(r=>r.mode==='daily').map(r=>r.date));let date=new Date();if(!dates.has(dayKey(date)))date.setDate(date.getDate()-1);let n=0;while(dates.has(dayKey(date))){n++;date.setDate(date.getDate()-1)}return n}
function allAnswers(){return p().records.flatMap(r=>r.answers||[])}
function percentage(a){return a.length?Math.round(100*a.filter(x=>x.ok).length/a.length):0}
function points(){return allAnswers().filter(a=>a.ok).length*20}
function level(s){return Math.min(6,Math.max(1,Number(p().levels[s])||1))}
function completedToday(){return p().records.some(r=>r.mode==='daily'&&r.date===dayKey())}
function cardStat(icon,value,label,color,bg){return `<div class="stat"><span class="stat-icon" style="color:${color};background:${bg}">${icon}</span><div><strong>${value}</strong><span>${esc(label)}</span></div></div>`}
function nav(name,icon){return `<button type="button" data-nav="${name}" class="sidenav" ${page===name?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${T(name)}</button>`}
function layout(body){let current=p();document.documentElement.lang=lang();document.documentElement.dataset.theme=data.theme==='dark'?'dark':'light';document.body.classList.toggle('reduce-motion',!!data.reduceMotion);const safeName=esc(current.name);document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><span class="mark">✦</span>MindForge</div><div class="side-sub">${txt('A thinking playground','Sân chơi tư duy')}</div><nav class="navset" aria-label="Main navigation">${nav('dashboard','◫')}${nav('practice','◇')}${nav('progress','↗')}${nav('family','☻')}${nav('settings','⚙')}</nav><div class="side-bottom"><div class="sidebar-fact"><span class="star">✳</span><strong>${T('topTip')}</strong><p>${T('topText')}</p></div><div class="sidebar-disclaimer tiny">${T('whyNote')}</div></div></aside><main class="workspace"><header class="topbar"><div class="crumb">✦ MindForge / ${run?(run.mode==='daily'?T('daily'):skillName(run.mode)):T(page)}</div><div class="top-controls"><select class="select" data-control="profile" aria-label="${T('change')}">${data.profiles.map(v=>`<option value="${esc(v.id)}" ${v.id===current.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select><select class="select" data-control="lang" aria-label="${T('language')}"><option value="en" ${lang()==='en'?'selected':''}>EN</option><option value="vi" ${lang()==='vi'?'selected':''}>VI</option></select><button type="button" class="icon-btn" data-action="theme" aria-label="${T('darkMode')}">${data.theme==='dark'?'☀️':'🌙'}</button><span class="avatar" title="${safeName}">${safeName.slice(0,1).toUpperCase()}</span></div></header>${body}</main><nav class="mobilebar" aria-label="Mobile navigation">${[['dashboard','◫'],['practice','◇'],['progress','↗'],['family','☻'],['settings','⚙']].map(([name,icon])=>`<button type="button" data-nav="${name}" ${page===name?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${T(name)}</button>`).join('')}</nav></div>`;}
function heading(title,sub){return `<div class="page-head"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>`}
function gameCard(id){const g=GAME[id];return `<button class="game-card" data-start="${id}" type="button"><span class="game-icon" style="background:${g.shade};color:${g.accent}" aria-hidden="true">${g.icon}</span><div style="flex:1;min-width:0"><span class="game-arrow">↗</span><h3>${skillName(id)}</h3><p>${esc(g[lang()+'Desc'])}</p><div class="meta"><span class="tag">${T('level')} ${level(id)}</span><span>◷ ${txt('3–5 min','3–5 phút')}</span></div></div></button>`}
function renderHome(){const current=p(),answers=allAnswers();layout(`<div class="hero"><div class="hero-copy"><div class="eyebrow">${T('today')}</div><h1>${T('heroTitle')}</h1><p>${T('heroText')}</p><button type="button" class="btn btn-invert" data-start="daily">${completedToday()?'↻ '+T('startDaily'):'▶ '+T('startDaily')}</button></div><div class="brain-art" aria-hidden="true"><div class="brain-main">🧠</div><span class="float a">✳</span><span class="float b">✦</span><span class="float c"></span></div></div><a class="mf-library-promo" href="./games/" aria-label="${txt('Browse all 13 MindForge games','Khám phá cả 13 trò chơi MindForge')}"><span class="mf-library-art" aria-hidden="true">◈</span><span><b>${txt('Discover all 13 games','Khám phá 13 trò chơi')}</b><small>${txt('Filter by memory, logic, age, level or play time.','Lọc theo trí nhớ, suy luận, độ tuổi, cấp độ hoặc thời gian.')}</small></span><strong aria-hidden="true">↗</strong></a><div class="stats">${cardStat('✦',current.records.length,T('sessions'),'#6c59e8','#f0ebff')}${cardStat('◎',answers.length?`${percentage(answers)}%`:'—',T('accuracy'),'#19ab91','#e3f9f1')}${cardStat('🔥',streak(),T('streak'),'#ea964a','#fff1dd')}</div><div class="section-title"><div><h2>${T('daily')}</h2><p>${T('dailyDesc')}</p></div><span class="tag" style="background:${completedToday()?'#dff7eb':''}">${completedToday()?'✓ '+T('dailyDone'):T('now')}</span></div><div class="daily-card"><div><strong>${completedToday()?'🌟 '+T('dailyDone'):'🌱 '+T('welcome')+', '+esc(current.name)}</strong><p>${completedToday()?T('alreadyToday'):T('welcomeSub')}</p><div class="daily-dots" aria-hidden="true">${SKILLS.map(()=>`<i class="${completedToday()?'done':''}"></i>`).join('')}</div></div><button type="button" class="btn btn-primary" data-start="daily">${completedToday()?'↻':'▶'}</button></div><div class="section-title"><div><h2>${T('explore')}</h2><p>${T('allGames')}</p></div><button type="button" class="section-link" data-nav="practice">${T('practice')} →</button></div><div class="games">${SKILLS.map(gameCard).join('')}</div><div class="notice"><strong>ⓘ ${T('reviewHint')}</strong> ${T('trainingTip')}${current.age==='sprout'?` ${T('littleDisclaimer')}`:''}</div>`)}
function renderPractice(){layout(`<a class="mf-library-promo" href="./games/" aria-label="${txt('Browse all 13 MindForge games','Khám phá cả 13 trò chơi MindForge')}"><span class="mf-library-art" aria-hidden="true">◈</span><span><b>${txt('Discover all 13 games','Khám phá 13 trò chơi')}</b><small>${txt('Filter by memory, logic, age, level or play time.','Lọc theo trí nhớ, suy luận, độ tuổi, cấp độ hoặc thời gian.')}</small></span><strong aria-hidden="true">↗</strong></a>${heading(T('practiceTitle'),T('practiceSub'))}<div class="games">${SKILLS.map(gameCard).join('')}</div><div class="notice">${T('trainingTip')}</div>`)}
function renderProgress(){const records=p().records,answers=allAnswers(),last=records.slice(-7);let chart=last.length?`<div class="chart" aria-label="${T('recent')}">${last.map((r,i)=>`<div class="chart-bar" title="${r.date}: ${r.score}%" data-label="${i+1}" style="height:${Math.max(6,r.score)}%"></div>`).join('')}</div><p class="tiny">${last.map((r,i)=>`${i+1}: ${r.date} (${r.score}%)`).join(' · ')}</p>`:`<div class="empty"><span class="emoji">📊</span>${T('noSessions')}</div>`;layout(`${heading(T('progressTitle'),T('progressSub'))}<div class="stats">${cardStat('✦',records.length,T('sessions'),'#6c59e8','#f0ebff')}${cardStat('◎',answers.length?percentage(answers)+'%':'—',T('accuracy'),'#19ab91','#e3f9f1')}${cardStat('✷',points(),T('earned'),'#ea964a','#fff1dd')}</div><div class="two-panels"><section class="panel"><h2>${T('recent')}</h2>${chart}</section><section class="panel"><h2>${T('skillBreakdown')}</h2><div class="skill-rows">${SKILLS.map(id=>{let a=answers.filter(x=>x.skill===id);return `<div class="skill-line"><div class="name">${GAME[id].icon} ${skillName(id)}</div><div class="meter"><span style="width:${a.length?percentage(a):0}%"></span></div><span class="pct">${a.length?percentage(a)+'%':'—'}</span></div>`}).join('')}</div><p class="tiny" style="margin:19px 0 0">${T('yourLevel')}: ${SKILLS.map(id=>`${skillName(id)} ${level(id)}`).join(' · ')}</p></section></div><section class="panel"><h2>💡 ${T('bestNext')}</h2><p style="color:var(--muted);margin:0 0 17px">${T('bestNextText')}</p><button class="btn btn-primary" type="button" data-nav="practice">${T('practiceAnother')} →</button></section><div class="notice">${T('whyNote')}</div>`)}
function renderFamily(){layout(`${heading(T('profileTitle'),T('profileSub'))}<div class="profile-grid">${data.profiles.map(v=>`<div class="profile-card ${v.id===p().id?'current':''}"><div class="profile-avatar">${esc(v.name.slice(0,1).toUpperCase())}</div><div class="info"><h3>${esc(v.name)}</h3><p>${AGES[v.age]?.[lang()]||AGES.adult[lang()]} · ${v.records.length} ${T('sessionsLabel')}</p><div class="meta" style="margin-top:11px">${v.id===p().id?`<span class="tag">✓ ${T('you')}</span>`:`<button class="btn btn-soft" style="padding:5px 11px;min-height:30px" data-switch="${esc(v.id)}">${T('use')}</button>`}${data.profiles.length>1?`<button class="btn btn-ghost" style="padding:5px 7px;min-height:30px;color:var(--red)" data-delete="${esc(v.id)}">${T('remove')}</button>`:''}</div></div></div>`).join('')}</div><section class="panel" style="margin-top:18px"><h2>${T('addProfile')}</h2><form class="form-row" id="create-profile"><div class="field"><label for="player-name">${T('name')}</label><input id="player-name" name="player-name" maxlength="24" placeholder="${T('newName')}" autocomplete="off" required></div><div class="field"><label for="player-age">${T('chooseAge')}</label><select id="player-age" name="player-age">${Object.keys(AGES).map(k=>`<option value="${k}">${AGES[k][lang()]}</option>`).join('')}</select></div><button class="btn btn-primary" type="submit">+ ${T('add')}</button></form><p class="tiny" style="margin-top:12px">${T('ageInfo')} ${T('profileLimit')}</p></section><div class="notice">🔒 ${T('privacy')}</div>`)}
function settingRow(title,desc,key,checked){return `<div class="setting-row"><div><strong>${title}</strong><span>${desc}</span></div><button type="button" class="switch" role="switch" data-toggle="${key}" aria-label="${title}" aria-checked="${checked}"></button></div>`}
function renderSettings(){layout(`${heading(T('settingsTitle'),T('settingsSub'))}<section class="panel"><h2>${T('settings')}</h2>${settingRow(T('darkMode'),T('darkHelp'),'theme',data.theme==='dark')}${settingRow(T('motion'),T('motionHelp'),'motion',!!data.reduceMotion)}${settingRow(T('shapeMode'),T('shapeHelp'),'shapes',!!p().settings.shapeFocus)}</section><section class="panel"><h2>${T('data')}</h2><p style="color:var(--muted)">${T('privacy')}</p><div class="flexrow"><button class="btn btn-soft" type="button" data-action="export">↓ ${T('export')}</button><button class="btn btn-danger" type="button" data-action="reset">${T('reset')}</button></div></section><div class="notice">${T('whyNote')}</div>`)}
function render(){if(run){if(run.phase==='complete')renderResult();else renderRun();return}if(page==='practice')renderPractice();else if(page==='progress')renderProgress();else if(page==='family')renderFamily();else if(page==='settings')renderSettings();else renderHome()}
function makePattern(){let lv=level('pattern'),age=p().age;const simple=age==='sprout'||(age==='explorer'&&lv<=2)||(age==='senior'&&lv===1);if(simple){const options=shuffle(SHAPES).slice(0,4),a=options[0],b=options[1],c=options[2],mode=lv<=2?0:rand(0,1),seq=mode? [a,b,c,a,b]:[a,b,a,b,a];const correct=mode?c:b;return{skill:'pattern',question:T('patternPrompt'),sequence:seq,options:shuffle([...options]),correct,explanation:mode?txt('The three symbols repeat in order.','Ba biểu tượng lặp theo thứ tự.'):txt('The two symbols alternate.','Hai biểu tượng thay phiên nhau.')}}
const kind=lv<=1?'step':shuffle(lv>=4?['step','alternate','multiply','squares','growing']:['step','alternate','multiply'])[0];let vals=[],ans=0,ex='';if(kind==='step'){let n=rand(2,12),step=rand(2,Math.min(8,3+lv*2));vals=Array.from({length:5},(_,i)=>n+i*step);ans=n+5*step;ex=txt(`Add ${step} each time.`,`Mỗi lần cộng ${step}.`)}if(kind==='alternate'){let n=rand(2,8),a=rand(2,5),b=a+rand(2,5),v=n;vals=[v];for(let i=0;i<5;i++){v+=i%2===0?a:b;vals.push(v)}ans=vals[5];vals=vals.slice(0,5);ex=txt(`The differences alternate +${a}, +${b}.`,`Hiệu giữa các số luân phiên +${a}, +${b}.`)}if(kind==='multiply'){let n=rand(1,3),mul=lv>3?3:2;vals=Array.from({length:5},(_,i)=>n*mul**i);ans=n*mul**5;ex=txt(`Multiply by ${mul} each time.`,`Mỗi lần nhân ${mul}.`)}if(kind==='squares'){let n=rand(1,4);vals=Array.from({length:5},(_,i)=>(n+i)**2);ans=(n+5)**2;ex=txt('These are consecutive square numbers.','Đây là dãy các số chính phương liên tiếp.')}if(kind==='growing'){let n=rand(1,6),step=rand(1,3),increase=rand(1,2),v=n;vals=[v];for(let i=0;i<5;i++){v+=step+i*increase;vals.push(v)}ans=vals[5];vals=vals.slice(0,5);ex=txt(`The differences grow by ${increase} each time.`,`Hiệu tăng thêm ${increase} sau mỗi bước.`)}const wrong=new Set();let jitter=[-2,-1,1,2,3,5,7,-5,-7,10];for(const d of shuffle(jitter)){const candidate=ans+d*(kind==='multiply'?Math.max(2,Math.round(ans/10)):1);if(candidate>0&&candidate!==ans)wrong.add(candidate);if(wrong.size===3)break}return{skill:'pattern',question:T('patternPrompt'),sequence:vals,options:shuffle([ans,...wrong]),correct:ans,explanation:`${ex} ${txt('Next:','Tiếp theo:')} ${ans}.`}}
function selectQuiz(skill,bank,seen){let levelNow=level(skill),age=p().age;let pool=bank.filter(item=>item.ages.includes(age));let allowed=pool.filter(item=>item.tier<=Math.max(age==='sprout'?1:2,levelNow+1));if(!allowed.length)allowed=pool;let unused=allowed.filter(item=>!seen.has(bank.indexOf(item)));if(!unused.length){seen.clear();unused=allowed}let item=unused[rand(0,unused.length-1)];seen.add(bank.indexOf(item));const ix=lang()==='vi'?1:0;return{skill,question:item.q[ix],options:item.a[ix].map((text,i)=>({label:text,value:i})),correct:item.c,explanation:item.why[ix]}}
function makeFocus(){let age=p().age,shapeMode=p().settings.shapeFocus||age==='sprout'||age==='explorer';if(shapeMode){let symbol=rand(0,5),choices=shuffle(SHAPES.map((s,i)=>({label:s,value:i}))).slice(0,4);if(!choices.some(v=>v.value===symbol))choices[rand(0,3)]={label:SHAPES[symbol],value:symbol};return{skill:'focus',shape:true,word:SHAPES[symbol],options:shuffle(choices),correct:symbol,explanation:txt(`Match the symbol ${SHAPES[symbol]} while ignoring the others.`,`Chọn biểu tượng ${SHAPES[symbol]}, bỏ qua các biểu tượng khác.`)}}let word=rand(0,3),ink=rand(0,3);if(Math.random()<.8){while(ink===word)ink=rand(0,3)}let askInk=Math.random()>.5;return{skill:'focus',shape:false,word:COLORS[word][lang()],ink:COLORS[ink].hex,askInk,options:shuffle(COLORS.map((c,i)=>({label:c[lang()],value:i}))),correct:askInk?ink:word,explanation:txt(`The rule was ${askInk?'INK COLOR':'WORD'}. The answer is ${COLORS[askInk?ink:word].en}.`,`Quy tắc là ${askInk?'MÀU CHỮ':'TỪ'}. Đáp án là ${COLORS[askInk?ink:word].vi}.`)}}
function makeMemory(){let lv=level('memory'),age=p().age,grid=(age==='sprout'||age==='senior'?3:lv<=3?3:4),size=grid*grid,count=Math.min(size-2,(age==='sprout'?2:age==='senior'?2:3)+Math.floor((lv-1)/2)),lit=shuffle(Array.from({length:size},(_,i)=>i)).slice(0,count).sort((a,b)=>a-b);return{skill:'memory',grid,lit,delay:(age==='sprout'||age==='senior'?5500:4300)+Math.max(0,count-3)*400}}
function makeTask(skill){if(skill==='pattern')return makePattern();if(skill==='memory')return makeMemory();if(skill==='focus')return makeFocus();if(skill==='logic')return selectQuiz('logic',QUESTIONS,logicSeen);return selectQuiz('decision',DECISIONS,decisionSeen)}
function start(mode){clearTimeout(roundTimer);roundTimer=null;logicSeen.clear();decisionSeen.clear();const plan=mode==='daily'?shuffle([...SKILLS]):Array(5).fill(mode);run={mode,plan,index:0,answers:[],task:null,phase:'question',selected:new Set(),answeredAt:0,startedAt:Date.now()};page='practice';nextTask()}
function nextTask(){clearTimeout(roundTimer);roundTimer=null;if(!run)return;if(run.index>=run.plan.length){finishSession();return}run.task=makeTask(run.plan[run.index]);run.phase='question';run.selected=new Set();run.answeredAt=Date.now();render()}
function progressGameHeader(){let id=run.task.skill,g=GAME[id];return `<button type="button" class="back-btn" data-action="leave">${T('quit')}</button><div class="challenge"><div class="challenge-top"><span class="game-icon" style="background:${g.shade};color:${g.accent}" aria-hidden="true">${g.icon}</span><div><h2>${skillName(id)}</h2><p>${run.mode==='daily'?T('daily'):T('sessionType')} · ${T('level')} ${level(id)}</p></div><div class="round-label">${T('round')} ${run.index+1} ${T('of')} ${run.plan.length}</div></div><div class="round-track" role="progressbar" aria-label="${T('rounds')}" aria-valuenow="${run.index+1}" aria-valuemin="0" aria-valuemax="${run.plan.length}"><span style="width:${((run.index+1)/run.plan.length)*100}%"></span></div><div class="challenge-body">`}
function optionHtml(opt,i){const chosen=run.phase==='feedback'&&run.selected.has(i),correct=run.phase==='feedback'&&(run.task.skill==='pattern'?opt.value===run.task.correct:opt.value===run.task.correct);return `<button class="option ${correct?'correct':chosen?'wrong':''}" type="button" data-answer="${i}" ${run.phase==='feedback'?'disabled':''} aria-label="${i+1}: ${esc(opt.label)}"><span class="opt-letter">${'ABCD'[i]}</span><span>${esc(opt.label)}</span></button>`}
function feedbackHtml(){if(run.phase!=='feedback')return '';let last=run.answers.at(-1),ok=last.ok;return `<div class="feedback" aria-live="polite"><h3>${ok?'✅ '+T('wellDone'):'💡 '+T('tryAgain')}</h3><p><strong>${T('solution')}:</strong> ${esc(run.task.explanation)}</p><button type="button" class="btn btn-primary" data-action="next">${run.index===run.plan.length-1?T('finish'):T('next')}</button></div>`}
function renderRun(){const task=run.task,id=task.skill;let content='';if(id==='pattern'){const opts=task.options.map(x=>({label:String(x),value:x}));content=`<div class="question-kicker">${T('question')}</div><h3 class="question">${T('patternPrompt')}</h3><div class="sequence">${task.sequence.map(v=>`<div class="seq-tile">${esc(v)}</div>`).join('')}<div class="seq-tile missing">?</div></div><div class="options">${opts.map(optionHtml).join('')}</div>`}else if(id==='logic'||id==='decision'){content=`<div class="question-kicker">${id==='logic'?T('logicPrompt'):T('decisionPrompt')}</div><h3 class="question">${esc(task.question)}</h3><div class="options">${shuffleOnceOptions(task).map(optionHtml).join('')}</div>`}else if(id==='focus'){let rule=task.shape?T('focusShape'):task.askInk?T('focusInk'):T('focusWord');content=`<div class="question-kicker">${T('focusPrompt')}</div><h3 class="question">${T('focusTip')}</h3><div class="rule-box">🎯 ${rule}</div><div class="stimulus"><span class="word" style="${task.shape?'':'color:'+task.ink}">${esc(task.word)}</span></div><div class="options">${task.options.map(optionHtml).join('')}</div>`}else if(id==='memory'){let mem=run.phase==='question'?`<button class="btn btn-primary" data-action="memory-show">▶ ${T('show')}</button>`:run.phase==='recall'?`<button class="btn btn-primary" data-action="memory-check" ${run.selected.size===0?'disabled':''}>${T('submit')}</button>`:'';let cells=Array.from({length:task.grid*task.grid},(_,i)=>{const lit=task.lit.includes(i);const selected=run.selected.has(i);const style=run.phase==='preview'&&lit?'lit':run.phase==='feedback'&&lit?'revealed':run.phase==='feedback'&&selected&&!lit?'mistake':selected?'selected':'';return `<button type="button" class="memory-cell ${style}" data-cell="${i}" aria-label="${T('tile')} ${i+1}" aria-pressed="${selected}" ${run.phase==='recall'?'':'disabled'}>${selected?'✓':''}</button>`}).join('');content=`<div class="question-kicker">${T('rememberShapes')}</div><h3 class="question" style="text-align:center">${run.phase==='question'?T('ready'):run.phase==='preview'?T('memorize'):T('recall')}</h3><p class="memory-hint">${run.phase==='question'?T('watch'):run.phase==='recall'?`${run.selected.size} / ${task.lit.length} ${T('selected')}`:T('rememberShapes')}</p><div class="memory-grid" style="grid-template-columns:repeat(${task.grid},1fr)">${cells}</div><div class="center">${mem}</div>`}
layout(`<div class="challenge-shell">${progressGameHeader()}${content}${feedbackHtml()}<p class="tiny" style="margin:19px 0 0">${id==='memory'?'':T('press')}</p></div></div></div>`)}
function shuffleOnceOptions(task){if(!task.shuffled){task.shuffled=shuffle(task.options);task.options=task.shuffled}return task.options}
function markAnswer(index){if(!run||run.phase!=='question'||run.task.skill==='memory')return;let task=run.task,options=task.skill==='pattern'?task.options.map(x=>({value:x})):task.options;const sel=options[index];if(!sel)return;let ok=sel.value===task.correct;run.selected=new Set([index]);run.answers.push({skill:task.skill,ok,answer:String(sel.value),date:dayKey(),seconds:Math.round((Date.now()-run.answeredAt)/1000)});run.phase='feedback';render();announce(ok?T('wellDone'):T('tryAgain'))}
function memoryShow(){if(!run||run.task.skill!=='memory'||run.phase!=='question')return;run.phase='preview';render();roundTimer=setTimeout(()=>{if(!run||run.task.skill!=='memory'||run.phase!=='preview')return;run.phase='recall';run.answeredAt=Date.now();render();announce(T('recall'))},run.task.delay)}
function memoryTile(n){if(!run||run.task.skill!=='memory'||run.phase!=='recall')return;let max=run.task.lit.length;if(run.selected.has(n))run.selected.delete(n);else if(run.selected.size<max)run.selected.add(n);render()}
function memoryCheck(){if(!run||run.task.skill!=='memory'||run.phase!=='recall'||run.selected.size===0)return;let task=run.task;let ok=run.selected.size===task.lit.length&&task.lit.every(x=>run.selected.has(x));task.explanation=txt(`The glowing tiles were positions ${task.lit.map(x=>x+1).join(', ')} (counting left to right).`,`Các ô phát sáng nằm ở vị trí ${task.lit.map(x=>x+1).join(', ')} (đếm từ trái sang phải).`);run.answers.push({skill:'memory',ok,answer:[...run.selected].sort((a,b)=>a-b).join(','),date:dayKey(),seconds:Math.round((Date.now()-run.answeredAt)/1000)});run.phase='feedback';render();announce(ok?T('wellDone'):T('tryAgain'))}
function advance(){if(!run||run.phase!=='feedback')return;run.index++;nextTask()}
function updateLevels(answers){for(const skill of SKILLS){let fresh=answers.filter(a=>a.skill===skill);if(!fresh.length)continue;let older=p().skillResults[skill]||[];let merged=[...older,...fresh.map(a=>a.ok)].slice(-25);let prev=p().skillAttempts[skill]||0,next=prev+fresh.length;if(Math.floor(next/5)>Math.floor(prev/5)){let recent=merged.slice(-5),accuracy=recent.filter(Boolean).length/5;if(accuracy>=.8)p().levels[skill]=Math.min(6,level(skill)+1);else if(accuracy<=.2)p().levels[skill]=Math.max(1,level(skill)-1)}p().skillResults[skill]=merged;p().skillAttempts[skill]=next}}
function finishSession(){if(!run)return;let finished={id:'r'+Date.now(),date:dayKey(),mode:run.mode,answers:run.answers,score:percentage(run.answers),duration:Math.max(1,Math.round((Date.now()-run.startedAt)/1000))};updateLevels(finished.answers);p().records.push(finished);p().records=p().records.slice(-365);persist();run={...run,phase:'complete',finished};renderResult()}
function renderResult(){const r=run.finished;layout(`<div class="challenge-shell"><div class="challenge"><div class="result-page"><span class="result-icon">${r.score>=80?'🏆':r.score>=50?'✨':'🌱'}</span><div class="eyebrow dark">${T('achievement')}</div><h2>${T('completed')}</h2><div class="result-score">${r.score}%</div><p>${T('completeCaption')}${r.mode==='daily'?` · ${T('dailyFinished')}`:''}</p><div class="result-metrics"><span>✓ ${r.answers.filter(x=>x.ok).length} / ${r.answers.length} ${T('right')}</span><span>✦ ${r.answers.filter(x=>x.ok).length*20} ${T('earned')}</span><span>◷ ${Math.ceil(r.duration/60)} min</span></div><div class="result-actions"><button class="btn btn-primary" type="button" data-action="replay">↻ ${T('again')}</button><button class="btn btn-soft" type="button" data-nav="dashboard">${T('home')}</button><button class="btn btn-soft" type="button" data-nav="progress">${T('progress')} ↗</button></div><div class="notice" style="max-width:560px;margin:26px auto 0;text-align:left">${T('trainingTip')}</div></div></div></div>`)}
function announce(s){document.getElementById('live-region').textContent=s}
function go(to){clearTimeout(roundTimer);roundTimer=null;run=null;page=to;render();window.scrollTo({top:0,behavior:'instant'})}
function toggle(k){if(k==='theme')data.theme=data.theme==='dark'?'light':'dark';else if(k==='motion')data.reduceMotion=!data.reduceMotion;else if(k==='shapes')p().settings.shapeFocus=!p().settings.shapeFocus;persist();render()}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),app:'MindForge',data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`mindforge-progress-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function click(e){let el=e.target.closest('[data-nav],[data-start],[data-action],[data-toggle],[data-answer],[data-cell],[data-switch],[data-delete]');if(!el)return;if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.start){start(el.dataset.start);return}if(el.dataset.switch){data.activeId=el.dataset.switch;persist();go('family');return}if(el.dataset.delete){if(data.profiles.length<=1)return;if(!confirm(T('deleteWarn')))return;data.profiles=data.profiles.filter(x=>x.id!==el.dataset.delete);if(data.activeId===el.dataset.delete)data.activeId=data.profiles[0].id;persist();go('family');return}if(el.dataset.toggle){toggle(el.dataset.toggle);return}if(el.dataset.answer!==undefined){markAnswer(Number(el.dataset.answer));return}if(el.dataset.cell!==undefined){memoryTile(Number(el.dataset.cell));return}let a=el.dataset.action;if(a==='theme'){toggle('theme');return}if(a==='leave'){go('practice');return}if(a==='next'){advance();return}if(a==='memory-show'){memoryShow();return}if(a==='memory-check'){memoryCheck();return}if(a==='replay'){let mode=run.mode;start(mode);return}if(a==='export'){exportData();return}if(a==='reset'){if(!confirm(T('resetWarn')))return;p().records=[];p().skillResults={};p().skillAttempts={};p().levels={pattern:1,memory:1,logic:1,focus:1,decision:1};persist();render()}}
function change(e){let v=e.target.value;if(e.target.dataset.control==='lang'){data.lang=v;persist();if(run){if(run.phase==='complete')renderResult();else go('practice')}else render()}else if(e.target.dataset.control==='profile'){data.activeId=v;persist();go('dashboard')}}
function submit(e){if(e.target.id!=='create-profile')return;e.preventDefault();const name=document.getElementById('player-name')?.value.trim();const age=document.getElementById('player-age')?.value;if(!name){alert(T('nameRequired'));return}if(data.profiles.length>=8){alert(T('maxProfiles'));return}const profile=createProfile(name.slice(0,24),AGES[age]?age:'adult');data.profiles.push(profile);data.activeId=profile.id;persist();go('family')}
function keys(e){if(e.target.closest('input,select,textarea')||e.ctrlKey||e.altKey||e.metaKey)return;if(run&&run.phase==='feedback'&&e.key==='Enter'){advance();return}if(run&&run.phase==='question'&&run.task.skill!=='memory'&&/^[1-4]$/.test(e.key)){markAnswer(Number(e.key)-1)}}
document.addEventListener('click',click);document.addEventListener('change',change);document.addEventListener('submit',submit);document.addEventListener('keydown',keys);const playFromLibrary=new URLSearchParams(location.search).get('play');if(SKILLS.includes(playFromLibrary))start(playFromLibrary);else render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();

</script>
