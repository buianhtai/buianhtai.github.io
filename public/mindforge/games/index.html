 case 'cube':case 'cube3d':o=`<path d="m130 14 65 37-65 40-65-40Z" fill="#c9b7ff"/><path d="m65 51 65 40v58l-65-40Z" fill="#796dca"/><path d="m195 51-65 40v58l65-40Z" fill="#9bcde5"/><path d="M98 66l30 17M164 68l-27 17" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>`;if(kind==='cube3d')o+=`<circle cx="200" cy="27" r="12" fill="#90e7cd"/><path d="M209 120c29-17 21-47 7-57" stroke="#ffdfa7" fill="none" stroke-width="4" stroke-dasharray="6 6"/>`;break;

function matches(g){const q=state.search.trim().toLocaleLowerCase();if(q){const text=[g.en,g.vi,g.enDesc,g.viDesc,t(g.skill),g.id].join(' ').toLocaleLowerCase();if(!text.includes(q))return false}if(state.skill!=='all'&&state.skill!==g.skill)return false;if(state.age!=='all'&&!g.ages.includes(state.age))return false;if(state.level!=='all'&&!g.levels.includes(state.level))return false;if(state.time==='quick'&&g.time>5)return false;if(state.time==='medium'&&(g.time<=5||g.time>10))return false;if(state.time==='long'&&g.time<10)return false;return true}
const order=['math','traffic','sudoku','scene','memory','cube','maze','pattern','focus','logic','tower3d','cube3d','maze3d','decision'];
function choices(){return gameList.filter(matches).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id))}
function card(g){const desc=g[state.lang+'Desc'],name=g[state.lang];const n=order.indexOf(g.id)+1;return `<article class="game-card" data-game="${g.id}"><div class="game-art">${illustration(g.kind)}<span class="pill">${t(g.skill)}</span><span class="card-number">${String(n).padStart(2,'0')} / 14</span></div><div class="card-body"><h3>${h(name)}</h3><p>${h(desc)}</p><div class="metadata"><span>◷ ${g.time} ${state.lang==='vi'?'phút':'min'}</span><span>${g.adaptive?t('adaptive'):t('starter')+'–'+t('advanced')}</span>${g.webgl?`<span>3D</span>`:''}</div><div class="card-bottom"><span class="hint">${g.webgl?t('webgl'):state.lang==='vi'?'Tư duy & khám phá':'Play & explore'}</span><a class="play" data-launch="${g.id}" href="${g.route}" aria-label="${h(t('play')+': '+name)}">${t('play')} <span aria-hidden="true">↗</span></a></div></div></article>`}
function option(key,values){return `<div class="field"><label for="f-${key}">${t(key==='level'?'difficulty':key==='time'?'duration':key)}</label><select id="f-${key}" data-filter="${key}">${values.map(v=>`<option value="${v[0]}" ${state[key]===v[0]?'selected':''}>${t(v[1])}</option>`).join('')}</select></div>`}
function render(){document.documentElement.lang=state.lang;document.documentElement.dataset.theme=state.theme;const list=choices();const activeCount=['age','level','time'].filter(k=>state[k]!=='all').length;const shown=state.expanded||list.length<=6||state.skill!=='all'||state.search||activeCount?list:list.slice(0,6);const vi=state.lang==='vi';$('app').innerHTML=`<div class="shell"><header class="top"><a class="brand" href="../"><span class="brand-mark">✦</span><span>MindForge<small>${vi?'KHÔNG GIAN TRÒ CHƠI':'THE PLAY COLLECTION'}</small></span></a><div class="topright"><a class="nav-library" href="#library">${vi?'Trò chơi':'Games'}</a><a class="toplink" href="../">${t('daily')} ↗</a><button id="theme" class="icon-switch theme mf-visible-theme" aria-pressed="${state.theme==='dark'}" aria-label="${vi?'Giao diện đang chọn: ':'Current theme: '}${state.theme==='light'?(vi?'Sáng':'Light'):(vi?'Tối':'Dark')}" title="${vi?'Đổi giao diện':'Switch appearance'}">${state.theme==='light'?'☾':'☀'} <span>${state.theme==='light'?(vi?'Sáng':'Light'):(vi?'Tối':'Dark')}</span></button><button id="lang" class="icon-switch lang" aria-label="${vi?'Switch to English':'Chuyển sang tiếng Việt'}">${vi?'EN':'VI'}</button></div></header><section class="hero"><div class="hero-copy"><div class="eyebrow">${vi?'CHƠI · HỌC · KHÁM PHÁ':'PLAY · LEARN · EXPLORE'}</div><h1>${t('title')}</h1><p>${t('subtitle')}</p><div class="hero-actions"><a class="primary" href="#library">${t('browse')} <span aria-hidden="true">↘</span></a><button id="surprise" class="secondary">✦ ${t('surprise')}</button></div><div class="hero-stats"><span>◈ ${t('games')}</span><span>${vi?'6 NHÓM KỸ NĂNG':'6 SKILL AREAS'}</span><span>${vi?'CHƠI THEO NHỊP ĐỘ':'AT YOUR OWN PACE'}</span></div></div><div class="featured"><div class="featuretop"><span class="featurelabel">${vi?'GỢI Ý HÔM NAY':'FEATURED CHALLENGE'}</span><span class="feature-chip">${vi?'Tư duy chiến lược':'Spatial planning'}</span></div><div class="featurevisual" aria-hidden="true">${illustration('traffic')}</div><div class="featurebottom"><div><h2>Traffic Escape</h2><p>${vi?'Giải thoát chiếc xe đỏ.':'Find a way out of the jam.'}</p></div><a class="featured-play" data-launch="traffic" href="../arcade/traffic/" aria-label="${vi?'Chơi Traffic Escape':'Play Traffic Escape'}">${t('play')} <span aria-hidden="true">↗</span></a></div></div></section><section id="library"><div class="section-title"><div><h2>${t('heading')}</h2><p>${t('sub')}</p></div><span class="count"><span class="dot"></span>${list.length} / ${gameList.length}</span></div><div class="discovery"><div class="searchrow"><label class="searchbox" for="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.4" stroke="currentColor" stroke-width="1.8"/><path d="m15.6 15.6 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="${t('search')}" value="${h(state.search)}" autocomplete="off" aria-label="${t('search')}"></label><button id="filters-toggle" class="filter-toggle ${activeCount?'active':''}" aria-expanded="${state.advancedOpen}" aria-controls="advanced-filters">☷ ${t('filters')}${activeCount?` <span>${activeCount}</span>`:''}</button></div><div class="skills" role="group" aria-label="${t('heading')}">${sk.map(k=>`<button class="skill ${state.skill===k?'active':''}" data-skill="${k}" aria-pressed="${state.skill===k}">${t(k)}</button>`).join('')}</div><div id="advanced-filters" class="filters" ${state.advancedOpen?'':'hidden'}><div class="filtergrid">${option('age',[['all','anyAge'],['preschool','preschool'],['school','school'],['teen','teen'],['adult','adult'],['senior','senior']])}${option('level',[['all','anyLevel'],['starter','starter'],['normal','normal'],['advanced','advanced']])}${option('time',[['all','anyTime'],['quick','quick'],['medium','medium'],['long','long']])}</div><div class="filter-foot"><span class="tiny">${t('guidance')}</span><button class="link-btn" id="reset-filters">${t('clear')}</button></div></div></div><div class="resultline"><strong id="resultcount" aria-live="polite">${list.length} ${t('results')}</strong><span>${t('showing')} ${shown.length} ${t('of')} ${list.length}</span></div><div class="grid" id="cards">${shown.length?shown.map(card).join(''):`<div class="empty"><h3>${t('none')}</h3><p>${t('noneTip')}</p><button id="empty-reset" class="filter-toggle">${t('clear')}</button></div>`}</div>${list.length>6&&!state.search&&state.skill==='all'&&activeCount===0?`<button id="showmore" class="showmore">${t(state.expanded?'less':'more')} ${state.expanded?'↑':'↓'}</button>`:''}</section><footer class="footer"><span>${t('footer')}</span><a href="../">${vi?'Trở về MindForge':'Back to MindForge'} ↗</a></footer></div>`;}
function refreshCards(){const list=choices(),activeCount=['age','level','time'].filter(k=>state[k]!=='all').length;const shown=state.expanded||list.length<=6||state.skill!=='all'||state.search||activeCount?list:list.slice(0,6);$('cards').innerHTML=shown.length?shown.map(card).join(''):`<div class="empty"><h3>${t('none')}</h3><p>${t('noneTip')}</p><button id="empty-reset" class="secondary">${t('clear')}</button></div>`;$('resultcount').textContent=`${list.length} ${t('results')}`;document.querySelector('.section-title .count').innerHTML=`<span class="dot"></span>${list.length} / ${gameList.length}`;document.querySelector('.resultline>span').textContent=`${t('showing')} ${shown.length} ${t('of')} ${list.length}`;const more=$('showmore');if(more){more.hidden=!!(state.search||state.skill!=='all'||activeCount||list.length<=6);more.textContent=state.expanded?t('less')+' ↑':t('more')+' ↓';}}
function resetFilters(){state.skill='all';state.age='all';state.level='all';state.time='all';state.search='';state.expanded=false;render();$('search').focus()}
$('app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='theme'){state.theme=state.theme==='light'?'dark':'light';try{localStorage.setItem('mf-library-theme',state.theme)}catch{}render();return}if(b.id==='lang'){state.lang=state.lang==='vi'?'en':'vi';try{localStorage.setItem('mf-library-lang',state.lang)}catch{}render();return}if(b.id==='filters-toggle'){state.advancedOpen=!state.advancedOpen;render();$('filters-toggle').focus();return}if(b.dataset.skill){state.skill=b.dataset.skill;state.expanded=false;render();return}if(b.id==='showmore'){state.expanded=!state.expanded;render();return}if(b.id==='reset-filters'||b.id==='empty-reset'){resetFilters();return}if(b.id==='surprise'){let arr=choices();if(!arr.length){resetFilters();arr=choices()}const game=arr[Math.floor(Math.random()*arr.length)];window.location.assign(game.route);return}});
$('app').addEventListener('input',e=>{if(e.target.id==='search'){const input=e.target;const a=input.selectionStart;state.search=input.value;state.expanded=false;refreshCards();if(document.activeElement!==input)input.focus();if(a!==null){try{input.setSelectionRange(a,a)}catch{}}}});
$('app').addEventListener('change',e=>{const k=e.target.dataset.filter;if(k&&['age','level','time'].includes(k)){state[k]=e.target.value;state.expanded=false;refreshCards();const n=['age','level','time'].filter(x=>state[x]!=='all').length;const b=$('filters-toggle');b.classList.toggle('active',!!n);b.innerHTML=`⚙ ${t('filters')}${n?` <span>${n}</span>`:''}`;}});
$('app').addEventListener('click',e=>{const a=e.target.closest('[data-launch]');if(!a)return;try{localStorage.setItem('mf-library-lastgame',a.dataset.launch)}catch{}});
render();
})();
