 case 'tower':o=`<path d="M54 97l72 40 78-40-74-40Z" fill="#46617c"/>`+box(81,57,34,62,'#a897ff',3)+box(116,33,34,86,'#89e4cb',3)+box(152,72,33,47,'#ffd59e',3)+`<path d="M81 57l17-13 34 5-17 8m1-24 18-13 31 8-15 5" fill="#e4dcff" stroke="#e4dcff"/>`;break;
 case 'sudoku':o=`<rect x="75" y="10" width="111" height="128" rx="10" fill="#d7d8f7"/>`;for(let i=1;i<3;i++)o+=`<path d="M${75+37*i} 10V138M75 ${10+42*i}H186" stroke="#796aa5" stroke-width="3"/>`;o+=`<g fill="#334365" font-size="26" font-weight="bold"><text x="86" y="43">1</text><text x="161" y="85">5</text><text x="123" y="129">9</text></g>`;break;
 case 'traffic':o=`<rect x="38" y="24" width="185" height="113" rx="13" fill="#324c72"/>`;for(let i=1;i<6;i++)o+=`<path d="M${38+i*31} 24v113" stroke="#516887" stroke-width="2"/>`;o+=box(48,59,110,34,'#ff8a96',12)+box(163,28,33,113,'#81c6ed',9)+`<rect x="65" y="65" width="62" height="21" rx="8" fill="#fff2db"/><path d="m199 89 25 0m-9-9 10 9-10 9" stroke="#86e8cb" stroke-width="6" stroke-linecap="round" fill="none"/>`;break;
 }
 return frame+o+'</svg>';
}
function matches(g){const q=state.search.trim().toLocaleLowerCase();if(q){const text=[g.en,g.vi,g.enDesc,g.viDesc,t(g.skill),g.id].join(' ').toLocaleLowerCase();if(!text.includes(q))return false}if(state.skill!=='all'&&state.skill!==g.skill)return false;if(state.age!=='all'&&!g.ages.includes(state.age))return false;if(state.level!=='all'&&!g.levels.includes(state.level))return false;if(state.time==='quick'&&g.time>5)return false;if(state.time==='medium'&&(g.time<=5||g.time>10))return false;if(state.time==='long'&&g.time<10)return false;return true}
const order=['traffic','sudoku','scene','memory','cube','maze','pattern','focus','logic','tower3d','cube3d','maze3d','decision'];
function choices(){return gameList.filter(matches).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id))}
function card(g){const desc=g[state.lang+'Desc'],name=g[state.lang];const label=g.adaptive?t('adaptive'):g.time>=10?t('advanced'):g.levels.length===3?t('starter')+' → '+t('advanced'):t('normal');return `<article class="game-card" data-game="${g.id}"><div class="game-art">${illustration(g.kind)}<span class="pill">${t(g.skill)}</span></div><div class="card-body"><h3>${h(name)}</h3><p>${h(desc)}</p><div class="metadata"><span>◷ ${t('approx')} ${g.time} min</span><span>${g.adaptive?t('adaptive'):t('starter')+'–'+t('advanced')}</span>${g.webgl?`<span>3D</span>`:''}</div><div class="card-bottom"><span class="hint">${g.webgl?t('webgl'):''}</span><a class="play" data-launch="${g.id}" href="${g.route}" aria-label="${h(t('play')+': '+name)}">${t('play')} <span aria-hidden="true">↗</span></a></div></div></article>`}
function option(key,values){return `<div class="field"><label for="f-${key}">${t(key==='level'?'difficulty':key==='time'?'duration':key)}</label><select id="f-${key}" data-filter="${key}">${values.map(v=>`<option value="${v[0]}" ${state[key]===v[0]?'selected':''}>${t(v[1])}</option>`).join('')}</select></div>`}
function render(){document.documentElement.lang=state.lang;const list=choices();const activeCount=['age','level','time'].filter(k=>state[k]!=='all').length;const shown=state.expanded||list.length<=6||state.skill!=='all'||state.search||activeCount?list:list.slice(0,6);$('app').innerHTML=`<div class="shell"><header class="top"><a class="brand" href="../"><span class="brand-mark">✦</span><span>MindForge<small>${t('library')}</small></span></a><div class="topright"><a class="toplink" href="../">${t('daily')} ↗</a><button id="lang" class="lang" aria-label="${state.lang==='vi'?'Switch to English':'Chuyển sang tiếng Việt'}">${state.lang==='vi'?'EN':'VI'}</button></div></header><section class="hero"><div><div class="eyebrow">${t('library')}</div><h1>${t('title')}</h1><p>${t('subtitle')}</p><div class="hero-actions"><a class="primary" href="#library">${t('browse')} ↓</a><button id="surprise" class="secondary">✦ ${t('surprise')}</button></div><div class="hero-stats"><span>◈ ${t('games')}</span><span>◎ ${t('offline')}</span><span>✧ ${t('noAccount')}</span></div></div><div class="hero-art" aria-hidden="true"><span class="spark one">✦</span><span class="spark two">✧</span>${illustration('cube3d')}</div></section><section id="library"><div class="section-title"><div><h2>${t('heading')}</h2><p>${t('sub')}</p></div><span class="count">${list.length} / ${gameList.length}</span></div><div class="searchrow"><label class="searchbox" for="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="#a5b9d5" stroke-width="2"/><path d="m15 15 6 6" stroke="#a5b9d5" stroke-width="2"/></svg><input id="search" type="search" placeholder="${t('search')}" value="${h(state.search)}" autocomplete="off" aria-label="${t('search')}"></label><button id="filters-toggle" class="filter-toggle ${activeCount?'active':''}" aria-expanded="${state.advancedOpen}" aria-controls="advanced-filters">⚙ ${t('filters')}${activeCount?` <span>${activeCount}</span>`:''}</button></div><div class="skills" role="group" aria-label="${t('heading')}">${sk.map(k=>`<button class="skill ${state.skill===k?'active':''}" data-skill="${k}" aria-pressed="${state.skill===k}">${t(k)}</button>`).join('')}</div><div id="advanced-filters" class="filters" ${state.advancedOpen?'':'hidden'}><div class="filtergrid">${option('age',[['all','anyAge'],['preschool','preschool'],['school','school'],['teen','teen'],['adult','adult'],['senior','senior']])}${option('level',[['all','anyLevel'],['starter','starter'],['normal','normal'],['advanced','advanced']])}${option('time',[['all','anyTime'],['quick','quick'],['medium','medium'],['long','long']])}</div><div class="filter-foot"><span class="tiny">${t('guidance')}</span><button class="link-btn" id="reset-filters">${t('clear')}</button></div></div><div class="resultline"><strong id="resultcount" aria-live="polite">${list.length} ${t('results')}</strong><span>${t('showing')} ${shown.length} ${t('of')} ${list.length}</span></div><div class="grid" id="cards">${shown.length?shown.map(card).join(''):`<div class="empty"><h3>${t('none')}</h3><p>${t('noneTip')}</p><button id="empty-reset" class="secondary">${t('clear')}</button></div>`}</div>${list.length>6&&!state.search&&state.skill==='all'&&activeCount===0?`<button id="showmore" class="showmore">${t(state.expanded?'less':'more')} ${state.expanded?'↑':'↓'}</button>`:''}</section><footer class="footer"><span>${t('footer')}</span><a href="../">MindForge ↗</a></footer></div>`;}
function refreshCards(){const list=choices(),activeCount=['age','level','time'].filter(k=>state[k]!=='all').length;const shown=state.expanded||list.length<=6||state.skill!=='all'||state.search||activeCount?list:list.slice(0,6);$('cards').innerHTML=shown.length?shown.map(card).join(''):`<div class="empty"><h3>${t('none')}</h3><p>${t('noneTip')}</p><button id="empty-reset" class="secondary">${t('clear')}</button></div>`;$('resultcount').textContent=`${list.length} ${t('results')}`;document.querySelector('.section-title .count').textContent=`${list.length} / ${gameList.length}`;document.querySelector('.resultline>span').textContent=`${t('showing')} ${shown.length} ${t('of')} ${list.length}`;const more=$('showmore');if(more){more.hidden=!!(state.search||state.skill!=='all'||activeCount||list.length<=6);more.textContent=state.expanded?t('less')+' ↑':t('more')+' ↓';}}
function resetFilters(){state.skill='all';state.age='all';state.level='all';state.time='all';state.search='';state.expanded=false;render();$('search').focus()}
$('app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='lang'){state.lang=state.lang==='vi'?'en':'vi';try{localStorage.setItem('mf-library-lang',state.lang)}catch{}render();return}if(b.id==='filters-toggle'){state.advancedOpen=!state.advancedOpen;render();$('filters-toggle').focus();return}if(b.dataset.skill){state.skill=b.dataset.skill;state.expanded=false;render();return}if(b.id==='showmore'){state.expanded=!state.expanded;render();return}if(b.id==='reset-filters'||b.id==='empty-reset'){resetFilters();return}if(b.id==='surprise'){let arr=choices();if(!arr.length){resetFilters();arr=choices()}const game=arr[Math.floor(Math.random()*arr.length)];window.location.assign(game.route);return}});
$('app').addEventListener('input',e=>{if(e.target.id==='search'){const input=e.target;const a=input.selectionStart;state.search=input.value;state.expanded=false;refreshCards();if(document.activeElement!==input)input.focus();if(a!==null){try{input.setSelectionRange(a,a)}catch{}}}});
$('app').addEventListener('change',e=>{const k=e.target.dataset.filter;if(k&&['age','level','time'].includes(k)){state[k]=e.target.value;state.expanded=false;refreshCards();const n=['age','level','time'].filter(x=>state[x]!=='all').length;const b=$('filters-toggle');b.classList.toggle('active',!!n);b.innerHTML=`⚙ ${t('filters')}${n?` <span>${n}</span>`:''}`;}});
$('app').addEventListener('click',e=>{const a=e.target.closest('[data-launch]');if(!a)return;try{localStorage.setItem('mf-library-lastgame',a.dataset.launch)}catch{}});
render();
})();
</script>
