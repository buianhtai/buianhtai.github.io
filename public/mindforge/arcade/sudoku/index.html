function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function write(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true}catch{return false}}
let pref=read(PREF)||{},state={lang:pref.lang==='en'?'en':'vi',mode:SETTINGS[pref.mode]?pref.mode:'starter',puzzle:null,solution:null,values:null,notes:{},history:[],selected:-1,notesMode:false,mistakes:0,hintsUsed:0,elapsed:0,lastAt:Date.now(),paused:false,solved:false,zoom:false,status:'',statusType:'',lastAction:null},busy=false;
function t(k){return STR[state.lang][k]||STR.en[k]||k}
function store(){if(!state.puzzle)return;write(KEY,{mode:state.mode,puzzle:state.puzzle,solution:state.solution,values:state.values,notes:state.notes,history:state.history.slice(-80),selected:state.selected,notesMode:state.notesMode,mistakes:state.mistakes,hintsUsed:state.hintsUsed,elapsed:state.elapsed,paused:state.paused,solved:state.solved})}
function validNotes(notes,n){if(!notes||typeof notes!=='object')return{};const copy={};for(const [k,v] of Object.entries(notes)){const j=Number(k);if(Number.isInteger(j)&&j>=0&&j<n*n&&Array.isArray(v))copy[k]=v.filter(x=>Number.isInteger(x)&&x>=1&&x<=n)}return copy}
function restore(){const data=read(KEY);if(!data||!SETTINGS[data.mode]||!validPuzzle(data.puzzle,data.solution,SETTINGS[data.mode]))return false;const c=SETTINGS[data.mode];if(!Array.isArray(data.values)||data.values.length!==c.n*c.n||data.values.some((v,i)=>!Number.isInteger(v)||v<0||v>c.n||(data.puzzle[i]&&v!==data.puzzle[i])))return false;Object.assign(state,{mode:data.mode,puzzle:data.puzzle,solution:data.solution,values:data.values,notes:validNotes(data.notes,c.n),history:Array.isArray(data.history)?data.history.slice(-80):[],selected:Number.isInteger(data.selected)?Math.max(-1,Math.min(data.selected,c.n*c.n-1)):-1,notesMode:!!data.notesMode,mistakes:Number.isInteger(data.mistakes)&&data.mistakes>=0?data.mistakes:0,hintsUsed:Number.isInteger(data.hintsUsed)?Math.max(0,Math.min(3,data.hintsUsed)):0,elapsed:Number.isInteger(data.elapsed)&&data.elapsed>=0?data.elapsed:0,paused:!!data.paused,solved:!!data.solved,lastAt:Date.now()});return true}
function newPuzzle(mode=state.mode,skipConfirm=false){if(!skipConfirm&&state.puzzle&&!state.solved&&state.values?.some((v,i)=>v&&!state.puzzle[i])&&!confirm(t('confirmNew')))return;busy=true;state.mode=mode;write(PREF,{...pref,mode,lang:state.lang});setStatus(t('generating'));render();const job=()=>{try{const made=generatePuzzle(mode);state={...state,mode,puzzle:made.puzzle,solution:made.solution,values:clone(made.puzzle),notes:{},history:[],selected:made.puzzle.findIndex(x=>!x),notesMode:false,mistakes:0,hintsUsed:0,elapsed:0,lastAt:Date.now(),paused:false,solved:false,zoom:false,status:'',statusType:'',lastAction:null};store();busy=false;render();}catch(e){busy=false;setStatus(String(e),'error');render()}};setTimeout(job,16)}
function setStatus(text='',kind=''){state.status=text;state.statusType=kind;const box=$('status');if(box){box.innerHTML=`<span class="icon" aria-hidden="true">${kind==='error'?'◇':kind==='success'?'✦':'◈'}</span><span>${escapeHTML(text)}</span>`;box.className='status-line'+(kind?' '+kind:'')}}
const escapeHTML=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function formatTime(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
function snapshot(){state.history.push({values:clone(state.values),notes:JSON.parse(JSON.stringify(state.notes)),mistakes:state.mistakes,hintsUsed:state.hintsUsed});if(state.history.length>80)state.history.shift()}
function allowedValues(index){const c=SETTINGS[state.mode],illegal=new Set(peers(index,c).map(i=>state.values[i]).filter(Boolean));return Array.from({length:c.n},(_,i)=>i+1).filter(v=>!illegal.has(v))}
function hasConflict(index){const v=state.values[index];return v!==0&&peers(index,SETTINGS[state.mode]).some(i=>state.values[i]===v)}
function conflicts(){const bad=new Set();for(let i=0;i<state.values.length;i++)if(hasConflict(i))bad.add(i);return bad}
function complete(){return state.values.every((x,i)=>x===state.solution[i])}
function sound(role){window.MindForgeSound?.play(role)}
function enter(value){const i=state.selected;if(busy||state.paused||state.solved||i<0||state.puzzle[i])return;const c=SETTINGS[state.mode];if(value<1||value>c.n)return;
 if(state.notesMode){snapshot();const arr=state.notes[i]||[];state.notes[i]=arr.includes(value)?arr.filter(x=>x!==value):[...arr,value].sort();sound('select');setStatus(t('noteMode'));}else{if(state.values[i]===value)return;snapshot();state.values[i]=value;delete state.notes[i];if(value!==state.solution[i]){state.mistakes++;sound('miss');setStatus(t('mistake'),'error')}else{sound('place');setStatus(t('placed'),'success')}if(complete())win()}
 store();render();focusCell(i)}
function erase(){const i=state.selected;if(state.paused||state.solved||i<0||state.puzzle[i]||(!state.values[i]&&!state.notes[i]?.length))return;snapshot();state.values[i]=0;delete state.notes[i];sound('undo');setStatus(t('undoUsed'));store();render();focusCell(i)}
function undo(){if(!state.history.length||state.paused||state.solved){setStatus(t('nothingUndo'));renderStatus();return}const old=state.history.pop();state.values=old.values;state.notes=old.notes;state.mistakes=old.mistakes;state.hintsUsed=old.hintsUsed;sound('undo');setStatus(t('undoUsed'));store();render();focusCell(state.selected)}
function hint(){if(state.paused||state.solved)return;if(state.hintsUsed>=3){setStatus(t('noHints'),'error');renderStatus();return}let i=state.selected;if(i<0||state.puzzle[i]||state.values[i]===state.solution[i])i=state.values.findIndex((v,k)=>!state.puzzle[k]&&v!==state.solution[k]);if(i<0)return;snapshot();state.selected=i;state.values[i]=state.solution[i];delete state.notes[i];state.hintsUsed++;sound('collect');setStatus(t('hintUsed'),'success');if(complete())win();store();render();focusCell(i)}
function win(){state.solved=true;state.paused=false;const all=read(BEST)||{};const k=state.mode;all[k]=all[k]||{completed:0,best:null};all[k].completed++;if(!state.mistakes&&!state.hintsUsed&&(all[k].best==null||state.elapsed<all[k].best))all[k].best=state.elapsed;write(BEST,all);sound('complete')}
function select(index){if(state.paused||state.solved)return;state.selected=index;sound('tap');store();renderBoard();renderStatus();}
function related(a,b,c){const ra=Math.floor(a/c.n),rb=Math.floor(b/c.n),ca=a%c.n,cb=b%c.n;return ra===rb||ca===cb||(Math.floor(ra/c.h)===Math.floor(rb/c.h)&&Math.floor(ca/c.w)===Math.floor(cb/c.w))}
function renderBoard(){const b=$('board');if(!b||!state.puzzle||state.paused||state.solved)return;const c=SETTINGS[state.mode],bad=conflicts(),sel=state.selected,selVal=sel>=0?state.values[sel]:0;
 b.style.setProperty('--n',c.n);b.className='sudoku-board size-'+c.n;b.setAttribute('aria-label',state.lang==='vi'?`Sudoku ${c.n} nhân ${c.n}`:`Sudoku ${c.n} by ${c.n}`);
 b.innerHTML=state.values.map((v,i)=>{const r=Math.floor(i/c.n),col=i%c.n,classes=['cell'];if(state.puzzle[i])classes.push('given');if(sel===i)classes.push('selected');else if(sel>=0&&related(i,sel,c))classes.push('related');if(selVal&&v===selVal)classes.push('same');if(bad.has(i))classes.push('conflict');const right=(col+1)%c.w===0&&col<c.n-1,bottom=(r+1)%c.h===0&&r<c.n-1;if(right)classes.push('box-right');if(bottom)classes.push('box-bottom');if(!state.puzzle[i]&&v&&v===state.solution[i]&&i===state.lastAction)classes.push('hinted');const notes=state.notes[i]||[],mini=!v&&notes.length?'<span class="cell-notes">'+Array.from({length:9},(_,j)=>`<span>${j<c.n&&notes.includes(j+1)?j+1:''}</span>`).join('')+'</span>':'';const aria=`${t('number')} ${r+1}, ${col+1}: ${v||t('selected')}${state.puzzle[i]?', '+t('given'):''}`;return `<button type="button" class="${classes.join(' ')}" data-cell="${i}" role="gridcell" aria-rowindex="${r+1}" aria-colindex="${col+1}" aria-selected="${sel===i}" aria-label="${escapeHTML(aria)}" tabindex="${sel===i?'0':'-1'}">${v||mini}</button>`}).join('');
 $('board-scroll').classList.toggle('zoomed',state.zoom);$('board-scroll').className='board-scroll size-'+c.n+(state.zoom?' zoomed':'');}
function focusCell(i){if(i<0)return;const el=document.querySelector(`[data-cell="${i}"]`);if(el){el.focus({preventScroll:true});if(state.zoom)el.scrollIntoView({block:'nearest',inline:'nearest'})}}
function renderStatus(){const s=$('status');if(!s)return;s.innerHTML=`<span class="icon" aria-hidden="true">${state.statusType==='error'?'◇':state.statusType==='success'?'✦':'◈'}</span><span>${escapeHTML(state.status||t('selected'))}</span>`;s.className='status-line'+(state.statusType?' '+state.statusType:'');$('mistakes').textContent=state.mistakes;$('hints-left').textContent=3-state.hintsUsed;const time=$('timer');if(time)time.textContent=formatTime(state.elapsed);}
function ruleSvg(c){return `<svg viewBox="0 0 250 128" role="img" aria-label="${escapeHTML(t('noteTitle'))}"><rect x="55" y="4" width="125" height="125" rx="6" fill="#1b2d4a" stroke="#bfb1ff" stroke-width="2"/><g fill="#2b4660">${[0,1,2,3].flatMap(r=>[0,1,2,3].map(col=>`<rect x="${56+col*31}" y="${5+r*31}" width="30" height="30" rx="3"/>`)).join('')}</g><g font-size="18" text-anchor="middle" font-family="system-ui" font-weight="800"><text x="71" y="27" fill="#ffd58b">1</text><text x="102" y="27" fill="#a4e8d4">2</text><text x="133" y="27" fill="#d6b8ff">3</text><text x="164" y="27" fill="#fff">4</text><text x="71" y="58" fill="#d6b8ff">3</text><text x="102" y="58" fill="#fff">4</text><text x="133" y="58" fill="#ffd58b">1</text><text x="164" y="58" fill="#a4e8d4">2</text></g><path d="M55 66h125" stroke="#bfb1ff" stroke-width="4"/><path d="M118 4v125" stroke="#bfb1ff" stroke-width="4"/><g font-size="17" fill="#c9d5ee" text-anchor="middle" font-weight="800"><text x="71" y="90">2</text><text x="102" y="90">1</text><text x="133" y="90">4</text><text x="164" y="90">3</text><text x="71" y="119">4</text><text x="102" y="119">3</text><text x="133" y="119">2</text><text x="164" y="119">1</text></g><path d="m192 58 13 13 27-29" fill="none" stroke="#80e4c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function updateTop(){document.documentElement.lang=state.lang;$('language').textContent=state.lang==='vi'?'EN':'VI';$('eyebrow').textContent=t('eyebrow');$('headline').innerHTML=t('headline');$('intro-copy').textContent=t('intro');$('back').textContent=t('back');}
function side(){const best=read(BEST)||{},row=best[state.mode];$('info').innerHTML=`<h2>${t('rules')}</h2><div class="howto"><div class="step"><span class="step-icon">①</span><span>${t('step1')}</span></div><div class="step"><span class="step-icon">②</span><span>${t('step2')}</span></div><div class="step"><span class="step-icon">③</span><span>${t('step3')}</span></div></div><div class="rule-demo">${ruleSvg()}</div><div class="tips"><strong>${t('tipTitle')}</strong> ${t('tip')}</div><div class="records"><strong>${t('record')}</strong><p>${row?.completed?`${row.completed} × ${t('score')} · ${row.best==null?t('completeNote'):t('yourBest')+': '+formatTime(row.best)}`:t('none')}</p></div>`}
function render(){updateTop();side();const c=SETTINGS[state.mode],g=$('game');if(busy||!state.puzzle){g.innerHTML=`<div class="loading" role="status">${t('generating')}</div>`;return}const modes=`<div class="section-header"><h2>${t('choose')}</h2><button class="new-btn" data-action="new">↻ ${t('new')}</button></div><div class="modes" role="group" aria-label="${t('choose')}">${Object.keys(SETTINGS).map(key=>`<button class="mode ${state.mode===key?'active':''}" data-mode="${key}" aria-pressed="${key===state.mode}"><strong>${t(key)}</strong><small>${t(key+'Short')}</small></button>`).join('')}</div>`;
 if(state.solved){g.innerHTML=modes+`<div class="finish-screen"><div class="finish-orb" aria-hidden="true">🏆</div><p class="eyebrow">${t('done')}</p><h2>${t('solved')}</h2><p>${t('solvedDesc')}</p><div class="summary"><span>${t('time')}<strong>${formatTime(state.elapsed)}</strong></span><span>${t('mistakes')}<strong>${state.mistakes}</strong></span><span>${t('hints')}<strong>${state.hintsUsed} / 3</strong></span></div><div class="finish-actions"><button class="new-btn" data-action="new">${t('playAgain')} ↗</button><button class="chip" data-action="restart">${t('changeMode')}</button></div><p class="subtle">${t('completeNote')}</p></div>`;return}
 g.innerHTML=modes+`<div class="mission"><div><strong>🔎 ${t('mission')}</strong><p>${t('selected')}</p></div><span class="status-pill">${c.n} × ${c.n}</span></div><div class="board-top"><div class="counter">${t('time')}: <b id="timer">${formatTime(state.elapsed)}</b> · ${t('mistakes')}: <b id="mistakes">${state.mistakes}</b> · ${t('hints')}: <b id="hints-left">${3-state.hintsUsed}</b></div><button class="zoom-btn" data-action="zoom" aria-pressed="${state.zoom}">${state.zoom?t('fit'):t('zoom')} ⤢</button></div>`+
 (state.paused?`<div class="finish-screen"><div class="finish-orb">☕</div><h2>${t('paused')}</h2><p>${t('pausedInfo')}</p><button class="new-btn" data-action="pause">${t('resumeBtn')}</button></div>`:`<div class="board-scroll size-${c.n}${state.zoom?' zoomed':''}" id="board-scroll"><div id="board" class="sudoku-board size-${c.n}" role="grid" aria-rowcount="${c.n}" aria-colcount="${c.n}"></div></div><div class="pad-wrap"><div class="pad" style="--n:${c.n===9?5:c.n}" aria-label="${t('number')}">${Array.from({length:c.n},(_,i)=>`<button type="button" class="num" data-digit="${i+1}" aria-label="${t('number')} ${i+1}">${i+1}</button>`).join('')}</div><div class="tools"><button type="button" class="action ${state.notesMode?'active':''}" data-action="notes" aria-pressed="${state.notesMode}"><span class="symbol">✎</span><small>${t('noteMode')}</small></button><button type="button" class="action" data-action="erase"><span class="symbol">⌫</span><small>${t('erase')}</small></button><button type="button" class="action" data-action="undo" ${state.history.length?'':'disabled'}><span class="symbol">↶</span><small>${t('undo')}</small></button><button type="button" class="action" data-action="hint" ${state.hintsUsed>=3?'disabled':''}><span class="symbol">✦</span><small>${t('hint')} · ${3-state.hintsUsed}</small></button></div></div><div class="status-line" id="status" role="status" aria-live="polite"></div>`)+`<div class="board-top"><span class="subtle">🔒 ${t('privacy')}</span><button class="chip" data-action="pause">${state.paused?t('resumeBtn'):t('pause')}</button></div>`;
 if(!state.paused){renderBoard();renderStatus()}}
function action(name){if(name==='new'){newPuzzle(state.mode);return}if(name==='zoom'){state.zoom=!state.zoom;render();focusCell(state.selected);return}if(name==='notes'){state.notesMode=!state.notesMode;setStatus(t(state.notesMode?'noteOn':'noteOff'));store();render();focusCell(state.selected);return}if(name==='erase'){erase();return}if(name==='undo'){undo();return}if(name==='hint'){hint();return}if(name==='pause'){state.paused=!state.paused;state.lastAt=Date.now();store();render();return}if(name==='restart'){newPuzzle(state.mode,true)}}
$('game').addEventListener('click',e=>{const cell=e.target.closest('[data-cell]');if(cell){select(Number(cell.dataset.cell));focusCell(state.selected);return}const digit=e.target.closest('[data-digit]');if(digit){enter(Number(digit.dataset.digit));return}const button=e.target.closest('[data-action]');if(button){action(button.dataset.action);return}const mode=e.target.closest('[data-mode]');if(mode){if(mode.dataset.mode===state.mode)return;newPuzzle(mode.dataset.mode);return}});
$('language').addEventListener('click',()=>{state.lang=state.lang==='en'?'vi':'en';pref={...pref,lang:state.lang,mode:state.mode};write(PREF,pref);render()});
$('game').addEventListener('keydown',e=>{if(!state.puzzle||state.paused||state.solved)return;const i=state.selected,c=SETTINGS[state.mode];if(e.target.matches('[data-cell]')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let row=Math.floor(i/c.n),col=i%c.n;if(e.key==='ArrowUp')row=(row+c.n-1)%c.n;if(e.key==='ArrowDown')row=(row+1)%c.n;if(e.key==='ArrowLeft')col=(col+c.n-1)%c.n;if(e.key==='ArrowRight')col=(col+1)%c.n;select(row*c.n+col);focusCell(state.selected);return}if(e.key>='1'&&e.key<=String(c.n)&&!e.altKey&&!e.metaKey&&!e.ctrlKey){e.preventDefault();enter(Number(e.key))}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}else if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();action('notes')}});
document.addEventListener('visibilitychange',()=>{state.lastAt=Date.now();store()});
setInterval(()=>{if(!state.puzzle||state.paused||state.solved||document.hidden){state.lastAt=Date.now();return}const now=Date.now(),diff=Math.max(0,Math.min(5,Math.floor((now-state.lastAt)/1000)));if(diff){state.elapsed+=diff;state.lastAt=now;const clock=$('timer');if(clock)clock.textContent=formatTime(state.elapsed);if(state.elapsed%10===0)store()}},1000);
if(!restore())newPuzzle(state.mode,true);else{state.status=t('resume');render()}
window.MindForgeSudoku={SETTINGS,generatePuzzle,countSolutions,validPuzzle,solutionGrid,peers};
})();
</script>
