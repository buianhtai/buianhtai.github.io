function question(kind,level){
 const lv={starter:0,normal:1,advanced:2}[level]??0;let a,b,c,answer,display,hint,detail='',items=[],operator='';
 if(kind==='quick'){
  const ops=lv===0?['+','−']:lv===1?['+','−','×','÷']:['+','−','×','÷','complex'];operator=one(ops);
  if(operator==='+'){a=rand(lv?16:2,lv===2?140:lv?78:12);b=rand(lv?7:2,lv===2?95:lv?55:11);answer=a+b;display=`${a} + ${b} = ?`;hint=`${a} + ${b} = ${a} + (${b-1}) + 1`}
  if(operator==='−'){a=rand(lv?30:9,lv===2?240:lv?110:20);b=rand(2,a);answer=a-b;display=`${a} − ${b} = ?`;hint=`${a} − ${b} = (${a} − ${b-1}) − 1`}
  if(operator==='×'){a=rand(2,lv===2?19:9);b=rand(2,lv===2?16:9);answer=a*b;display=`${a} × ${b} = ?`;hint=`${a} × ${b} = ${a} × (${b-1}) + ${a}`}
  if(operator==='÷'){b=rand(2,lv===2?16:9);answer=rand(2,lv===2?18:10);a=b*answer;display=`${a} ÷ ${b} = ?`;hint=`${b} × ? = ${a}`}
  if(operator==='complex'){a=rand(3,18);b=rand(2,12);c=rand(1,28);answer=a*b+c;display=`${a} × ${b} + ${c} = ?`;hint=`(${a} × ${b}) + ${c}`} 
 }else if(kind==='missing'){
  operator=one(lv===0?['+','−']:['+','−','×','÷']);
  if(operator==='+'){a=rand(2,lv===2?100:lv?45:14);b=rand(2,lv===2?90:lv?45:14);answer=b;display=`${a} + <span class="unknown">□</span> = ${a+b}`;hint=`${a+b} − ${a} = □`}
  if(operator==='−'){a=rand(lv===0?8:20,lv===2?220:lv?90:20);b=rand(2,a);answer=b;display=`${a} − <span class="unknown">□</span> = ${a-b}`;hint=`${a} − ${a-b} = □`}
  if(operator==='×'){a=rand(2,lv===2?18:9);b=rand(2,lv===2?17:9);answer=b;display=`${a} × <span class="unknown">□</span> = ${a*b}`;hint=`${a*b} ÷ ${a} = □`}
  if(operator==='÷'){answer=rand(2,lv===2?18:9);b=rand(2,lv===2?16:9);a=answer*b;display=`${a} ÷ <span class="unknown">□</span> = ${b}`;answer=answer;hint=`${a} ÷ ${b} = □`}
 }else if(kind==='market'){
  const n=lv===0?2:lv===1?2:3;const used=[...catalog].sort(()=>Math.random()-.5).slice(0,n);

function nav(){return `<header class="top"><a href="../../games/" class="brand"><span class="mark">✦</span>MindForge <span style="color:var(--mint);font-size:13px">/ Math Quest</span></a><div class="top-actions"><a href="../../games/" class="mini">← ${t('back')}</a><button type="button" class="mini" data-action="theme" aria-label="${t('theme')}: ${state.theme==='dark'?t('themeDark'):t('themeLight')}" aria-pressed="${state.theme==='dark'}">${state.theme==='dark'?'☀':'☾'} ${state.theme==='dark'?t('themeDark'):t('themeLight')}</button><button class="mini" data-action="lang" aria-label="Language: ${state.lang}">${state.lang==='vi'?'EN':'VI'}</button></div></header>`}
function hero(){return `<section class="hero"><div><p class="eyebrow">MINDFORGE / NUMBER LAB</p><h1>${t('hero')}</h1><p>${t('sub')}</p><a href="./learn/" class="mf-learn-link" aria-label="${state.lang==='vi'?'Học toán qua hình ảnh':'Learn with pictures'}">🧩 ${state.lang==='vi'?'Học bằng hình ảnh':'Learn with pictures'} <span aria-hidden="true">↗</span></a><a href="./practice/" class="mf-learn-link" aria-label="${state.lang==='vi'?'Luyện toán qua hình ảnh':'Visual math practice'}">🧮 ${state.lang==='vi'?'Luyện tập trực quan':'Visual Practice'} <span aria-hidden="true">↗</span></a><a href="./review/" class="mf-learn-link" aria-label="${state.lang==='vi'?'Ôn bài làm sai':'Review missed concepts'}">🔁 ${state.lang==='vi'?'Ôn lỗi sai':'Mistake Review'} <span aria-hidden="true">↗</span></a></div><div class="art">${illustration()}</div></section>`}
function mode(){const options=[['mix','🎲'],['quick','➕'],['missing','◻'],['market','🛒']];return `<div class="controls"><div><p class="control-label">${t('difficulty')}</p><div class="level-row">${['starter','normal','advanced'].map(l=>`<button class="pill" type="button" data-level="${l}" aria-pressed="${state.level===l}">${t(l)}</button>`).join('')}</div></div><div><p class="control-label">${t('mode')}</p><div class="type-row">${options.map(([k,i])=>`<button class="pill" type="button" data-mode="${k}" aria-pressed="${state.mode===k}">${i} ${t(k)}</button>`).join('')}</div></div></div>`}
function round(animate=false){const q=active(),isDone=state.index>=difficulty[state.level],n=difficulty[state.level],status=state.feedback;
 if(isDone)return finish();
 const picture=q.kind==='market'?`<div class="shop">${q.items.map(it=>`<div class="shop-item"><span class="em" aria-hidden="true">${it.emoji}</span><strong>${it.price} 🪙 × ${it.qty}</strong><small>${it.qty} ${t('shopQty')}</small></div>`).join('')}</div>`:'';
 return `<section class="card question${animate?' slide-enter':''}"><div class="game-overline"><span>${t('round')} ${state.index+1}/${n}</span><span>${t('progress')}</span></div><div class="progress"><i style="width:${state.index/n*100}%"></i></div><div class="slide-deck" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="slide-step ${i<state.index?'done':i===state.index?'current':''}"></i>`).join('')}</div><div class="slide-toolbar"><small>${state.index+1} / ${n} · ${t('round')}</small><button type="button" class="mini auto-toggle" data-action="auto" aria-pressed="${state.autoNext}" aria-label="${t('autoNext')}: ${t(state.autoNext?'on':'off')}">${state.autoNext?'⏩':'⏸'} ${t('autoNext')}: ${t(state.autoNext?'on':'off')}</button></div><p class="subject">${t(q.kind)}</p><h2 class="question-title">${t(q.kind==='quick'?'question':q.kind==='missing'?'missingQ':'marketQ')}</h2>${picture}<div class="equation" aria-label="${safeText(q.display.replace(/<[^>]*>/g,''))}">${q.display}</div>${q.detail?`<p class="question-detail">${q.detail}</p>`:''}<form id="answer-form"><label class="sr" for="math-answer">${t('zero')}</label><div class="input-row"><input type="text" inputmode="numeric" pattern="[0-9]*" id="math-answer" class="answer" autocomplete="off" maxlength="5" value="${safeText(state.input)}" placeholder="?" ${status?.ok||status?.over?'disabled':''}><button class="submit" type="submit" ${status?.ok||status?.over?'disabled':''}>${t('check')}</button></div></form><div class="pad" role="group" aria-label="${t('zero')}">${[1,2,3,4,5,6,7,8,9,'undo',0,'erase'].map(k=>`<button type="button" data-key="${k}" class="${isNaN(Number(k))?'accent':''}" ${status?.ok||status?.over?'disabled':''}>${k==='undo'?'↶':k==='erase'?'⌫':k}</button>`).join('')}</div>${state.shownHint?`<div class="feedback" role="status"><strong>${t('hintLabel')}</strong> ${safeText(q.hint)}</div>`:''}${status?`<div role="status" class="feedback ${status.ok?'good':'bad'}"><strong>${t(status.ok?'good':'bad')}</strong>${status.over?` ${t('reveal')} ${q.answer}.`:''}${status.ok&&state.autoNext?`<span class="autonext-message">${t('autoMoving')}</span>`:''}</div>`:''}<div class="actions"><button class="mini" type="button" data-action="hint" ${state.shownHint||status?.ok||status?.over?'disabled':''}>💡 ${t('hint')}</button><button class="submit" type="button" data-action="next" ${!status?.ok&&!status?.over?'disabled':''}>${state.index===n-1?t('done'):t('next')} →</button></div></section>`
}
function finish(){return `<section class="card finish" aria-live="polite"><span class="medal">🏆</span><p class="eyebrow">${t('done')}</p><h2>${t('finish')}</h2><p>${t('finishText')}</p><div class="status-grid"><div class="stat"><b>${state.score}</b><span>${t('score')}</span></div><div class="stat"><b>${state.bestStreak}</b><span>${t('streak')}</span></div></div><button class="submit" data-action="new">↻ ${t('again')}</button></section>`}
function aside(){return `<aside class="card sidebar"><h3>${t('current')}</h3><div><div class="status-grid"><div class="stat"><b>${state.score}</b><span>${t('score')}</span></div><div class="stat"><b>${state.bestStreak}</b><span>${t('streak')}</span></div><div class="stat"><b>${state.best}</b><span>${t('best')}</span></div><div class="stat"><b>${state.index+1}/${difficulty[state.level]}</b><span>${t('round')}</span></div></div><button class="mini" data-action="new">↻ ${t('startOver')}</button></div><div class="hint-box"><strong>✦ ${t('about')}</strong><p>${t('aboutText')}</p></div><p class="aside-copy">${t('notice')}</p></aside>`}
function render(animate=false){document.documentElement.lang=state.lang;document.querySelector('#app').innerHTML=nav()+hero()+mode()+`<div class="board">${round(animate)}${aside()}</div>`;}
function cancelAuto(){if(autoTimer!==null){clearTimeout(autoTimer);autoTimer=null}}
function scheduleAuto(){cancelAuto();if(!state.autoNext||!state.feedback?.ok)return;const index=state.index;autoTimer=setTimeout(()=>{autoTimer=null;if(state.index===index&&state.autoNext&&state.feedback?.ok)next()},2200)}
function check(){if(state.feedback?.ok||state.feedback?.over)return;const raw=state.input.trim();if(!/^\d{1,5}$/.test(raw)){$('#math-answer')?.focus();return}const n=Number(raw),q=active();const ok=n===q.answer;state.tries++;if(ok){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);state.score+=state.shownHint?7:state.tries===1?10:5;state.best=Math.max(state.best,state.score);window.MindForgeSound?.play('success')}
 else {state.streak=0;window.MindForgeSound?.play('miss')}
 state.feedback={ok,over:!ok&&state.tries>=2};save();render();if(ok)scheduleAuto()}
function next(){cancelAuto();if(!state.feedback?.ok&&!state.feedback?.over)return;state.index++;state.input='';state.past='';state.shownHint=false;state.feedback=null;state.tries=0;if(state.index<difficulty[state.level])state.questions.push(createQuestion());window.MindForgeSound?.play(state.index===difficulty[state.level]?'complete':'next');save();render(true)}
function updateInput(raw){if(state.feedback?.ok||state.feedback?.over)return;state.input=String(raw).replace(/[^0-9]/g,'').slice(0,5);save();let input=$('#math-answer');if(input&&input.value!==state.input)input.value=state.input}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-level],[data-mode],[data-key]');if(!b)return;
 if(b.dataset.action==='theme'){cancelAuto();setTheme(state.theme==='dark'?'light':'dark');save();render();return}
 if(b.dataset.action==='lang'){cancelAuto();state.lang=state.lang==='vi'?'en':'vi';save();render();return}
 if(b.dataset.action==='auto'){state.autoNext=!state.autoNext;try{localStorage.setItem(AUTO,String(state.autoNext))}catch{}save();render();if(state.autoNext)scheduleAuto();else cancelAuto();return}
 if(b.dataset.level){if(state.level!==b.dataset.level){state.level=b.dataset.level;startNew(false)}return}
 if(b.dataset.mode){if(state.mode!==b.dataset.mode){state.mode=b.dataset.mode;startNew(false)}return}
 if(b.dataset.key!==undefined){const k=b.dataset.key;if(k==='erase')updateInput('');else if(k==='undo')updateInput(state.input.slice(0,-1));else updateInput(state.input+k);return}
 if(b.dataset.action==='hint'){state.shownHint=true;window.MindForgeSound?.play('select');save();render();return}
 if(b.dataset.action==='next'){next();return}
 if(b.dataset.action==='new'){startNew(true);return}
});
document.addEventListener('input',e=>{if(e.target.id==='math-answer')updateInput(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check()}});
let swipe=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,a')||!e.target.closest('.question'))return;swipe={x:e.clientX,y:e.clientY,id:e.pointerId}},{passive:true});document.addEventListener('pointerup',e=>{if(!swipe||swipe.id!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(dx < -75&&Math.abs(dx)>Math.abs(dy)*1.4&&(state.feedback?.ok||state.feedback?.over))next()},{passive:true});
restore();render();window.MindForgeMath={question,createQuestion,get state(){return state},setTheme};
})();
</script><script src="../sound-kit.js" defer></script></body></html>
