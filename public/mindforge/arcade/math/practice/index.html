<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc"><meta name="description" content="MindForge topic practice: count, compare and make ten with original visual puzzles.">
<title>Visual Practice · MindForge Math</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f6f8fc;--surface:#fff;--subtle:#f1f5fb;--ink:#19283f;--muted:#60738b;--border:#dce5ef;--accent:#6956df;--accent-ink:#fff;--accent-soft:#f0ebff;--mint:#168875;color-scheme:light}
html[data-theme=dark]{--bg:#101827;--surface:#19273c;--subtle:#24354c;--ink:#f3f7ff;--muted:#b4c3d6;--border:#344960;--accent:#b7aaff;--accent-ink:#172238;--accent-soft:#373052;--mint:#7ae1cb;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-width:280px;background:var(--bg);color:var(--ink)}button,a{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}.shell{max-width:1100px;margin:auto;padding:22px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px}.brand{font-weight:850;font-size:17px;letter-spacing:-.5px}.brand b{color:var(--mint)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.mini{border:1px solid var(--border);background:var(--surface);border-radius:12px;color:var(--ink);min-height:44px;padding:9px 13px;font-weight:750}.mini[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}.hero{border:1px solid var(--border);border-radius:24px;background:var(--surface);padding:24px 28px;margin-bottom:18px}.eyebrow{color:var(--mint);font-size:11px;letter-spacing:1.6px;font-weight:850;text-transform:uppercase}.hero h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;line-height:1.15;margin:8px 0}.hero p{color:var(--muted);max-width:650px}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:17px}.topic{display:flex;flex-direction:column;gap:5px;text-align:left;padding:17px;background:var(--surface);border:1px solid var(--border);border-radius:17px;color:var(--ink);min-height:122px}.topic strong{font-size:17px}.topic small{font-size:12px;color:var(--muted)}.topic[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft)}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:17px}.settings label{font-size:13px;font-weight:750}.settings select{border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--ink);min-height:44px;padding:8px 13px;font:inherit}.switch{display:flex;gap:8px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:11px;min-height:44px;padding:8px 13px;font-weight:750}.switch input{width:19px;height:19px;accent-color:var(--accent)}.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px 26px;min-width:0}.card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:750;font-size:12px}.progress{height:7px;background:var(--subtle);border-radius:7px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.question-title{font-size:clamp(21px,3vw,27px);line-height:1.3;letter-spacing:-.4px}.help{font-size:13px;color:var(--muted);margin:8px 0 12px}.visual{border:1px solid var(--border);border-radius:18px;background:var(--subtle);padding:17px;min-height:125px;margin:14px 0}.visual .mf-tenframe{display:block;width:100%;height:auto;max-width:510px;margin:0 auto}.visual .mf-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.visual .mf-group{min-width:0}.visual .mf-group h3{text-align:center;font-size:13px;margin:0 0 7px}.visual .mf-cell{cursor:pointer}.visual .mf-cell.selected rect,.visual .mf-cell:focus-visible rect{stroke:var(--accent);stroke-width:5px}.visual .mf-cell[aria-disabled=true]{cursor:default}.answer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:13px 0}.answer-grid.side{grid-template-columns:repeat(3,minmax(0,1fr))}.answer{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);min-height:54px;font-size:17px;font-weight:850;padding:9px}.answer[aria-pressed=true]{background:var(--accent-soft);border:2px solid var(--accent)}.answer.side{font-size:13px}.feedback{padding:13px 15px;background:var(--accent-soft);border:1px solid var(--border);border-radius:13px;margin:12px 0;line-height:1.55}.feedback.good{border-color:var(--mint)}.feedback.bad{border-color:#d79a68}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:15px}.primary{min-height:46px;border:0;border-radius:12px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);font-weight:850}.secondary{min-height:46px;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--ink);font-weight:750}.actions .primary:last-child{margin-left:auto}.done{text-align:center;padding:35px 10px}.done .emoji{font-size:55px}.done h2{font-size:27px;margin:7px 0}.done p{color:var(--muted);margin-bottom:18px}.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){.shell{padding:13px 13px 40px}.hero{padding:19px;border-radius:18px}.topics{gap:8px}.topic{padding:12px;min-height:112px}.topic strong{font-size:14px}.card{padding:17px 14px}.visual{padding:10px}.visual .mf-compare{gap:6px}}
@media(max-width:420px){.brand{font-size:14px}.top-actions{gap:5px}.mini{font-size:12px;padding:8px 9px}.hero h1{font-size:28px}.topics{grid-template-columns:1fr}.topic{min-height:62px;display:grid;grid-template-columns:30px 1fr;align-items:center;gap:2px 9px}.topic .symbol{grid-row:span 2}.topic small{grid-column:2}.answer-grid{gap:6px}.answer{min-height:48px;font-size:15px}.answer.side{font-size:11px;padding:6px}.visual .mf-group h3{font-size:11px}.settings{gap:8px}.settings label{font-size:12px}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
