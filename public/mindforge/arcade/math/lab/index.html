<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb"><title>MindForge · Interactive Math Lab</title>
<link rel="stylesheet" href="../learning/manipulatives.css">
<style>
:root{font:15px/1.5 system-ui,-apple-system,sans-serif;--bg:#f5f7fb;--surface:#fff;--text:#1b2945;--muted:#60708b;--line:#dfe6ef;--violet:#6255da}
[data-theme=dark]{--bg:#111729;--surface:#202b45;--text:#f4f6ff;--muted:#b9c6dd;--line:#3b4764;--violet:#b5a8ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer;color:inherit}
.shell{max-width:1040px;padding:20px 20px 65px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header a{color:inherit;font-weight:850;text-decoration:none}.tools{display:flex;gap:7px}.tools button,.tabs button,.reset{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 13px;min-height:44px}
.tools button:focus-visible,.tabs button:focus-visible,.reset:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
header,main{margin-bottom:22px}.eyebrow{color:var(--violet);font-size:11px;letter-spacing:1.7px;text-transform:uppercase;font-weight:850}h1{font-size:clamp(29px,6vw,51px);letter-spacing:-1.5px;line-height:1.1;margin:8px 0}p{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button[aria-pressed=true]{border-color:var(--violet);background:#ddd8ff;color:#30295c;font-weight:850}
.panel{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:23px}.panel h2{margin-top:0}.stage{min-height:260px;display:grid;place-items:center}.stage>*{width:100%;min-width:0}.message{background:var(--bg);border:1px solid var(--line);padding:13px 15px;border-radius:14px;margin:10px 0;min-height:50px}.reset{font-weight:800;margin-top:12px}
@media(max-width:500px){.shell{padding:12px 10px 40px}.panel{padding:13px}.tabs button{flex:1 1 42%;padding:9px 4px;font-size:12px}h1{font-size:29px}}
</style></head>
<body><div class="shell"><header><a href="../">✦ MindForge / Math Lab</a><div class="tools"><button id="theme" type="button">☾ Theme</button><button id="language" type="button">VI</button></div></header><main><p class="eyebrow">Interactive Math · Component preview</p><h1 id="title">Make numbers visible.</h1><p id="lead">Touch the objects or use Tab and Enter. This is a reusable component demo; your Math Quest scores stay unchanged.</p></main>
<div class="tabs" role="group" aria-label="Choose visual activity"><button data-mode="count" aria-pressed="true">Count</button><button data-mode="build" aria-pressed="false">Make 10</button><button data-mode="compare" aria-pressed="false">Compare</button><button data-mode="line" aria-pressed="false">Number line</button></div>
<section class="panel"><h2 id="instruction">Tap each star once</h2><div class="stage" id="stage"></div><div class="message" id="status" role="status" aria-live="polite"></div><button class="reset" id="reset" type="button">↻ Reset</button></section></div>
<script type="module">
import {mountTenFrame,mountCompare,mountNumberLine} from '../learning/manipulatives.mjs';
const $=id=>document.getElementById(id),modes=['count','build','compare','line'];
let mode='count',widget=null,language='en',theme='light';
try{language=localStorage.getItem('mf-language')||'en';theme=localStorage.getItem('mf-library-theme')||'light'}catch{}
if(!['en','vi'].includes(language))language='en';if(!['light','dark'].includes(theme))theme='light';
const tr={en:{title:'Make numbers visible.',lead:'Touch the objects or use Tab and Enter. This reusable component preview does not change your saved Math Quest.',count:'Tap each star once.',build:'Tap the empty spaces to make 10.',compare:'Match the objects in pairs.',line:'Select the number on the line.',reset:'Reset'},vi:{title:'Học toán bằng hình ảnh.',lead:'Chạm đồ vật hoặc dùng Tab và Enter. Đây là bản thử thành phần, không thay đổi điểm Math Quest.',count:'Chạm từng ngôi sao một lần.',build:'Chạm các ô trống để đủ mười.',compare:'Ghép từng cặp đồ vật giữa hai nhóm.',line:'Chọn một số trên trục số.',reset:'Làm lại'}};
function repaint(){
 if(widget)widget.destroy();
 const t=tr[language];document.documentElement.lang=language;document.documentElement.dataset.theme=theme;
 $('title').textContent=t.title;$('lead').textContent=t.lead;$('instruction').textContent=t[mode];$('reset').textContent='↻ '+t.reset;
 $('theme').textContent=(theme==='dark'?'☀ ':'☾ ')+(language==='vi'?'Giao diện':'Theme');$('language').textContent=language==='vi'?'EN':'VI';
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 $('status').textContent=language==='vi'?'Chạm để bắt đầu':'Tap to begin';
 const status=v=>{
  const n=mode==='compare'?v.paired.length:mode==='line'?v.value:v.total;
  $('status').textContent=mode==='compare'?(language==='vi'?'Đã ghép ':'Matched ')+n+' / 4':mode==='line'?(language==='vi'?'Đã chọn ':'Selected ')+n:(language==='vi'?'Số lượng: ':'Total: ')+n+(v.complete?' ✓':'');
 };
 $('stage').replaceChildren();
 if(mode==='count')widget=mountTenFrame($('stage'),{count:6,token:'star',language,onChange:status});
 if(mode==='build')widget=mountTenFrame($('stage'),{count:6,mode:'build',token:'flower',palette:'peach',language,onChange:status});
 if(mode==='compare')widget=mountCompare($('stage'),{left:4,right:7,token:'leaf',palette:'mint',language,onChange:status});
 if(mode==='line')widget=mountNumberLine($('stage'),{language,onChange:status});
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;repaint()}));
$('reset').addEventListener('click',repaint);
$('language').addEventListener('click',()=>{language=language==='vi'?'en':'vi';repaint()});
$('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('mf-library-theme',theme)}catch{}repaint()});
repaint();
</script></body></html>
