<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:280px;background:var(--bg);color:var(--text)}button,a{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:not-allowed}a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}.shell{max-width:1160px;margin:0 auto;padding:22px 24px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:29px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.6px;font-size:17px}.brand-symbol{display:grid;place-items:center;width:42px;height:42px;background:var(--accent);color:var(--accent-text);border-radius:14px;font-size:26px}.top-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.small-button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:12px;min-height:44px;padding:10px 12px;font-weight:700}.small-button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}.eyebrow{color:var(--mint);font-size:11px;font-weight:850;letter-spacing:1.7px;text-transform:uppercase}.masthead{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.55fr);align-items:center;gap:16px;background:var(--paper);border:1px solid var(--border);border-radius:25px;padding:28px 32px;margin-bottom:21px;box-shadow:var(--shadow)}.masthead h1{font-size:clamp(29px,4.5vw,46px);line-height:1.12;letter-spacing:-1.7px;margin:8px 0 10px}.masthead p{max-width:620px;color:var(--muted)}.scene-art{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}.scene-art span{width:65px;height:65px;display:grid;place-items:center;border-radius:17px;background:var(--soft);border:1px solid var(--border);font-size:34px}.scene-art span:nth-child(2){transform:translateY(14px);background:#def7ed}.scene-art span:nth-child(3){background:#fff0d9}.section-bar{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 0 13px}.section-bar h2{font-size:19px;letter-spacing:-.4px}.section-bar p{color:var(--muted);font-size:13px}.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:22px}.topic-card{text-align:left;border:1px solid var(--border);border-radius:20px;padding:20px;background:var(--paper);color:var(--text);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:180px}.topic-card:hover,.topic-card[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}.topic-card .topic-emoji{font-size:29px}.topic-card strong{font-size:18px}.topic-card small{color:var(--muted);font-size:12px}.topic-card span:last-child{margin-top:auto;color:var(--accent);font-weight:800;font-size:12px}.lesson-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}.lesson-nav,.lesson-card{background:var(--paper);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}.lesson-nav{padding:14px}.lesson-nav h3{font-size:13px;color:var(--muted);margin:6px 8px 10px}.lesson-option{width:100%;background:transparent;border:1px solid transparent;color:var(--text);text-align:left;border-radius:13px;padding:13px 12px;display:flex;align-items:center;gap:10px;min-height:50px}.lesson-option[aria-current=true]{background:var(--soft);border-color:var(--accent)}.lesson-option span:first-child{display:grid;place-items:center;width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:var(--paper2);font-weight:750}.lesson-option b{font-size:12px}.lesson-nav .tip{padding:14px 9px 5px;color:var(--muted);font-size:12px}.lesson-card{padding:24px 26px;min-height:430px}.lesson-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:750;font-size:12px}.steps{display:flex;gap:7px;margin:14px 0 21px}.step{height:6px;flex:1;border-radius:8px;background:var(--paper2)}.step.past{background:var(--mint)}.step.current{background:var(--accent)}.lesson-card h2{font-size:clamp(21px,3vw,28px);letter-spacing:-.65px;margin:5px 0 12px}.instruction{color:var(--muted);margin-bottom:15px}.visual-box{border:1px solid var(--border);background:var(--paper2);border-radius:20px;padding:20px;margin:13px 0 16px;overflow:hidden}.visual-box .mf-tenframe{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}.visual-box .mf-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.visual-box .mf-group h3{font-size:13px;text-align:center;margin:0 0 8px}.visual-box .mf-group .mf-tenframe{width:100%}.visual-box .mf-cell{cursor:pointer;transition:opacity .12s}.visual-box .mf-cell.selected rect{stroke:var(--accent);stroke-width:4px}.visual-box .mf-cell:focus{outline:none}.visual-box .mf-cell:focus-visible rect{stroke:var(--accent);stroke-width:5px}.visual-box .mf-cell[aria-disabled=true]{cursor:default;opacity:.83}.try-help{color:var(--muted);font-size:13px;margin:6px 0}.answers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0}.answers.side-answers{grid-template-columns:repeat(3,minmax(0,1fr))}.answer-button{border:1px solid var(--border);border-radius:12px;background:var(--paper);color:var(--text);font-weight:850;min-height:49px}.answer-button[aria-pressed=true]{border:2px solid var(--accent);background:var(--soft)}.status{margin:12px 0;padding:12px 15px;border-radius:13px;background:var(--soft);font-size:14px;line-height:1.55}.status.good{border:1px solid var(--mint)}.status.bad{border:1px solid #de956d}.status.info{border:1px solid var(--border)}.foot-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:17px}.foot-actions .next-button{margin-left:auto}.next-button{min-height:47px;border:0;border-radius:12px;padding:11px 20px;background:var(--accent);color:var(--accent-text);font-weight:850}.link-button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:12px;min-height:46px;padding:10px 14px;font-weight:700}.completion{padding:30px;text-align:center;display:grid;justify-items:center;gap:13px}.completion .big{font-size:59px}.completion h2{font-size:30px}.completion p{color:var(--muted);max-width:500px}.loading{padding:55px 15px;text-align:center;color:var(--muted)}.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.footer-note{text-align:center;margin:23px auto 0;color:var(--muted);font-size:12px;max-width:660px}
@media(max-width:850px){.lesson-layout{grid-template-columns:1fr}.lesson-nav{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.lesson-nav h3{flex-basis:100%}.lesson-option{width:auto;flex:1;min-width:125px}.lesson-nav .tip{display:none}}
@media(max-width:600px){.visual-box .mf-compare{grid-template-columns:1fr}.shell{padding:12px 12px 45px}.top{margin-bottom:13px}.brand{font-size:14px}.top-controls{gap:5px}.small-button{font-size:12px;padding:8px 9px}.masthead{grid-template-columns:minmax(0,1fr) 80px;padding:18px 16px;border-radius:20px}.masthead h1{font-size:27px;margin:5px 0}.masthead p{font-size:12px}.scene-art span{width:50px;height:50px;font-size:25px}.scene-art span:nth-child(2),.scene-art span:nth-child(3){display:none}.topic-grid{grid-template-columns:1fr;gap:8px}.topic-card{min-height:unset;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:3px 10px;padding:12px 14px;border-radius:15px}.topic-card .topic-emoji{grid-row:1/3}.topic-card strong{font-size:15px}.topic-card small{grid-column:2;font-size:11px}.topic-card span:last-child{grid-column:3;grid-row:1/3}.lesson-card{padding:16px 13px;border-radius:18px}.lesson-nav{padding:10px}.lesson-option{font-size:12px;min-width:90px;padding:8px;min-height:46px}.lesson-option span:first-child{width:25px;flex-basis:25px;height:25px}.visual-box{padding:10px;border-radius:15px}.visual-box .mf-compare{gap:5px}.visual-box .mf-group h3{font-size:11px}.answers{gap:6px}.answer-button{min-height:46px;font-size:13px}.foot-actions{gap:8px}.next-button,.link-button{font-size:13px}}
@media(max-width:330px){.brand{letter-spacing:-.8px}.topic-card{grid-template-columns:34px 1fr auto;padding:10px}.topic-card small{font-size:10px}.answer-button{font-size:12px}.visual-box .mf-compare{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.visual-box .mf-cell{transition:none}}
</style></head>
