const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const scenes=['tree','house','boat','balloon','kite','sun'];const loc={tree:[63,22,24,54],house:[34,34,31,37],boat:[65,60,26,35],balloon:[15,13,15,38],kite:[13,23,20,41],sun:[75,7,16,25]};
function wrap(body){document.documentElement.lang=state.lang;document.body.classList.toggle('reduce-motion',state.reduced);app.innerHTML=`<div class="app"><header class="topbar"><a href="../" class="brand"><span class="brand-mark">🧠</span><span>MindForge <span style="color:var(--mint)">/ Arcade</span></span></a><div class="top-actions"><button class="chip ${state.lang==='vi'?'active':''}" data-lang="vi" aria-pressed="${state.lang==='vi'}">VI</button><button class="chip ${state.lang==='en'?'active':''}" data-lang="en" aria-pressed="${state.lang==='en'}">EN</button><button class="chip" data-action="motion" aria-pressed="${state.reduced}">${state.reduced?'◉':'◎'} ${t('soundOff')}</button></div></header>${body}<footer class="note">🔒 ${t('privacy')}</footer></div>`}
function miniatureScene(){return `<svg viewBox="0 0 800 450" aria-hidden="true">${sceneSVG('none',false)}</svg>`}
function hub(){const cards=[['cube','🧊','✧','cube'],['scene','🖼️','✧','scene'],['maze','🧭','✧','maze']];const scores=readScore();wrap(`<main><section class="hero"><div><p class="eyebrow">${t('eyebrow')}</p><h1>${t('hero')}</h1><p>${t('heroSub')}</p></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><span class="hero-cube">🧊</span><span class="spark a">✦</span><span class="spark b">✧</span></div></section><div class="section-line"><div><h2>${t('explore')}</h2><p>${t('exploreSub')}</p></div><span class="count">${t('games')}</span></div><div class="cards">${cards.map(([key])=>`<article class="game-card"><div class="thumb ${key}">${key==='scene'?miniatureScene():`<span class="${key==='cube'?'emoji-cube':'maze-demo'}" aria-hidden="true">${key==='cube'?'🧊':'🗺️'}</span>`}</div><div class="card-body"><span class="card-kicker">${key==='cube'?'WORLD 01':key==='scene'?'WORLD 02':'WORLD 03'}</span><h3>${t(key)}</h3><p>${t(key+'Sub')}</p><div class="card-bottom"><span class="skill-pill">${t(key+'Tag')}${scores[(profile()?.id||'guest')+':'+key]?.best?' · ★ '+scores[(profile()?.id||'guest')+':'+key].best+'/5':''}</span><button class="icon-arrow" type="button" data-start="${key}" aria-label="${t('go')}: ${t(key)}">↗</button></div></div></article>`).join('')}</div></main>`)}
function sceneSVG(changed='none',after=false){const is=x=>after&&changed===x;return `<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#77c8ed"/><stop offset="1" stop-color="#e2f8f4"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#b8e6ad"/><stop offset="1" stop-color="#7bb9a7"/></linearGradient></defs><rect width="800" height="450" fill="url(#sky)"/><path d="M0 280L134 115 241 273 350 137 506 284 640 166 800 294v156H0Z" fill="#92b8c9"/><path d="M0 315Q175 228 348 307T800 291v159H0Z" fill="url(#hill)"/><path d="M0 357Q225 287 451 355T800 343v107H0Z" fill="#6cac92"/><path d="M0 389Q200 342 445 390T800 371v79H0Z" fill="#3a98a9"/><path d="M0 398Q155 371 278 397T518 401T800 389" stroke="#b2e8e5" stroke-width="8" fill="none"/><circle cx="661" cy="88" r="${is('sun')?24:42}" fill="#ffdc68"/><circle cx="661" cy="88" r="${is('sun')?33:51}" fill="none" stroke="#ffe9a5" stroke-width="8" opacity=".7"/><path d="M48 71q15-32 53 0 29-18 44 8H48ZM425 87q19-29 52 0 28-11 48 12h-100" fill="white" opacity=".78"/><path d="M124 190L${is('kite')?188:205} 114 242 211Z" fill="${is('kite')?'#db6f9e':'#745cdb'}" stroke="white" stroke-width="7"/><path d="M195 204Q220 260 250 289" stroke="#745cdb" stroke-width="5" stroke-dasharray="10 8" fill="none"/><path d="M300 292V220l98-74 108 79v67" fill="#d7a67f" stroke="#8d746e" stroke-width="9"/><path d="M281 227l119-95 125 97" fill="none" stroke="#b56668" stroke-linecap="round" stroke-width="25"/><rect x="343" y="239" width="47" height="54" rx="4" fill="${is('house')?'#e6d476':'#795c81'}"/><rect x="418" y="238" width="53" height="32" rx="5" fill="#c6e8f5" stroke="#fff8" stroke-width="8"/><path d="M565 341V197" stroke="#7c655f" stroke-width="20" stroke-linecap="round"/><circle cx="544" cy="206" r="49" fill="${is('tree')?'#e6a458':'#4f9d68'}"/><circle cx="597" cy="194" r="54" fill="${is('tree')?'#e6a458':'#4f9d68'}"/><circle cx="567" cy="151" r="52" fill="${is('tree')?'#e8ba63':'#75c27e'}"/><path d="M525 398l44-39 67 4 43 32-23 19H550Z" fill="#725879" stroke="#b5a7be" stroke-width="5"/><path d="M596 364V283l${is('boat')?68:0} 0 73 79Z" fill="${is('boat')?'#f3b963':'#fff9e6'}" stroke="#5b7188" stroke-width="7"/><path d="M614 361l-35-70 0 70" fill="#80c4d3"/><path d="M163 159C129 115 141 73 179 67c45-4 58 43 33 87l-21 27Z" fill="${is('balloon')?'#f0bd45':'#ef7a93'}" stroke="#fff6" stroke-width="6"/><path d="M181 171v29m13-29v29" stroke="#fff" stroke-width="5"/><path d="M170 198h35l-7 23h-22Z" fill="#9b6e5a"/><g fill="#f8d08f"><circle cx="76" cy="326" r="10"/><circle cx="114" cy="336" r="6"/><circle cx="450" cy="329" r="10"/><circle cx="486" cy="323" r="8"/></g>`}
const objectName=k=>t(k);const chosenFaceMap={front:'back',back:'front',left:'right',right:'left',top:'bottom',bottom:'top'};
function generate(){state.feedback=null;state.choice=null;if(state.game==='cube'){const faceNames=Object.keys(chosenFaceMap);state.faces=shuffle(['✦','◆','●','▲','♥','☀']);state.target=faceNames[Math.floor(Math.random()*faceNames.length)];state.cube={x:-22,y:-30};const idx=faceNames.indexOf(state.target),cor=state.faces[faceNames.indexOf(chosenFaceMap[state.target])];state.correct=cor;state.asked=state.faces[idx];state.opts=shuffle([cor,...shuffle(state.faces.filter(x=>x!==cor&&x!==state.asked)).slice(0,3)])}else if(state.game==='scene'){state.sceneIndex=(state.round+Math.floor(Math.random()*5))%scenes.length;state.sceneKey=scenes[state.sceneIndex]}else if(state.game==='maze'){const small=profile()?.age==='sprout',n=small?3:4;const scenarios=small?[[4],[3],[1,4]]:[[5,6,9],[1,6,10],[4,6,7,10],[5,9,13],[1,5,11]];const blocks=scenarios[state.round%scenarios.length];state.maze={n,blocks,goal:n*n-1,path:[0],mistakes:0}}}
function start(game){state.game=game;state.round=0;state.score=0;state.saved=false;generate();render()}
function stage(content){const round=Math.min(state.round+1,5);wrap(`<main class="stage"><div class="game-top"><div class="title-area"><button class="btn btn-quiet" type="button" data-action="back">${t('quit')}</button><h1>${t(state.game)}</h1><p>${t(state.game+'Sub')}</p></div><div class="stats"><span class="stat-pill">${t('round')} <b>${round}/5</b></span><span class="stat-pill">${t('score')} <b>${state.score}/5</b></span></div></div><div class="progress-track" role="progressbar" aria-valuenow="${state.round}" aria-valuemax="5" aria-valuemin="0" aria-label="${t('round')}"><div style="width:${state.round*20}%"></div></div>${content}</main>`)}
function feedback(){if(!state.feedback)return '';return `<div class="feedback" role="status" aria-live="polite"><strong>${state.feedback.ok?t('good'):t('bad')}</strong><div>${state.feedback.text}</div></div><div class="actions"><button class="btn btn-primary" data-action="next">${state.round===4?t('finish'):t('next')}</button></div>`}
function renderCube(){const labels=['front','back','right','left','top','bottom'];const symbols={front:state.faces[0],back:state.faces[1],left:state.faces[2],right:state.faces[3],top:state.faces[4],bottom:state.faces[5]};const choices=state.opts.map((x,i)=>`<button type="button" class="pick ${state.feedback?(x===state.correct?'correct':x===state.choice?'wrong':''):''}" data-choice="${i}" ${state.feedback?'disabled':''}><span aria-hidden="true">${x}</span><span class="visually-hidden">${x}</span></button>`).join('');stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 01 · 3D</p><h2>${t('cubeQuestion')} <span style="color:var(--mint)">${state.asked}</span>?</h2><p>${t('cubeGuide')}</p></div><div class="challenge-wrap cube-play"><div><div class="cube-viewport" id="cube-view" aria-label="Interactive 3D cube with six colored faces"><div class="cube-shape" id="cube-shape" style="--rx:${state.cube.x}deg;--ry:${state.cube.y}deg">${labels.map(face=>`<div class="cube-face ${face}"><b>${symbols[face]}</b><small>${face.toUpperCase()}</small></div>`).join('')}</div></div><div class="orbit-controls"><button data-orbit="left" aria-label="Rotate left">↶</button><button data-orbit="up" aria-label="Rotate up">↑</button><button data-orbit="down" aria-label="Rotate down">↓</button><button data-orbit="right" aria-label="Rotate right">↷</button></div><div class="orbit-hint">${t('orbit')}</div></div><div class="answers"><h3>${t('cubeQuestion')} ${state.asked}?</h3><div class="answer-grid">${choices}</div>${feedback()}</div></div></section>`)}
function renderScene(){const hit=state.sceneKey;const choices=scenes.map(x=>{const [left,top,width,height]=loc[x];return `<button class="scene-hit ${state.feedback?(x===hit?'correct':x===state.choice?'wrong':''):''}" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%" data-spot="${x}" aria-label="${objectName(x)}" title="${objectName(x)}" ${state.feedback?'disabled':''}></button>`}).join('');stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 02 · ILLUSTRATION</p><h2>${t('sceneQuestion')}</h2><p>${t('sceneGuide')}</p></div><div class="challenge-wrap"><div class="scene-grid"><div class="illustration-panel"><span class="scene-banner">${t('before')}</span><svg viewBox="0 0 800 450" role="img" aria-label="${t('before')}">${sceneSVG(hit,false)}</svg></div><div class="illustration-panel after"><span class="scene-banner">${t('after')}</span><svg viewBox="0 0 800 450" role="img" aria-label="${t('after')}">${sceneSVG(hit,true)}</svg>${choices}</div></div><div class="scene-legend">${scenes.map(x=>`<span>${objectName(x)}</span>`).join('')}</div>${feedback()}</div></section>`)}
function renderMaze(){const {n,blocks,path,goal}=state.maze;const curr=path.at(-1);const cells=Array.from({length:n*n},(_,i)=>{const wall=blocks.includes(i),visited=path.includes(i),goalHere=i===goal;const classes=[wall?'wall':'',visited?'path':'',goalHere?'goal':'',curr===i?'current':''].join(' ');const icon=curr===i?'🧑‍🚀':goalHere?'⭐':wall?'🪨':visited?'✦':'';return `<button class="maze-tile ${classes}" role="gridcell" data-tile="${i}" ${wall||state.feedback?'disabled':''} aria-label="${state.lang==='vi'?'Ô':'Tile'} ${Math.floor(i/n)+1},${i%n+1}${wall?' blocked':''}" aria-current="${i===curr?'step':'false'}"><span aria-hidden="true">${icon}</span></button>`}).join('');stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 03 · ISOMETRIC</p><h2>${t('mazeQuestion')}</h2><p>${t('mazeGuide')}</p></div><div class="challenge-wrap"><div class="maze-shell"><div class="maze-stage"><div class="maze-board" role="grid" style="--n:${n}" aria-label="${t('maze')}">${cells}</div></div><div class="maze-legend"><div><strong>${t('paths')}: ${Math.max(0,path.length-1)}</strong><p style="font-size:12px;line-height:1.8">${t('mazeHelp')}</p><p class="hint">${t('mazeHint')}</p></div><div><div class="movement"><span></span><button data-dir="up" aria-label="Up">↑</button><span></span><button data-dir="left" aria-label="Left">←</button><button data-action="undo" aria-label="Undo">↶</button><button data-dir="right" aria-label="Right">→</button><span></span><button data-dir="down" aria-label="Down">↓</button><span></span></div><button class="btn btn-quiet" data-action="reset">${t('reset')}</button></div></div></div>${feedback()}</div></section>`)}
function result(){if(!state.saved){saveScore(state.game,state.score);state.saved=true}stage(`<section class="game-panel reward"><span class="reward-icon" aria-hidden="true">${state.score>=4?'🏆':state.score>=2?'✨':'🌱'}</span><h1>${t('complete')} ${t(state.game)}</h1><p>${t('roundsDone')} 5 / 5</p><strong>${state.score}/5</strong><p>${t('noIQ')}</p><div class="actions"><button class="btn btn-primary" data-action="replay">↻ ${t('again')}</button><button class="btn" data-action="back">${t('tryMore')} →</button></div></section>`)}
function render(){if(!state.game)return hub();if(state.round>=5)return result();if(state.game==='cube')renderCube();else if(state.game==='scene')renderScene();else renderMaze()}
function answered(ok,text){state.feedback={ok,text};if(ok)state.score++;render()}
function moveMaze(next){const m=state.maze;if(state.feedback||next<0||next>=m.n*m||m.blocks.includes(next))return;const curr=m.path.at(-1),sameRow=Math.floor(curr/m.n)===Math.floor(next/m.n);const adj=(Math.abs(curr-next)===m.n)||(sameRow&&Math.abs(curr-next)===1);if(!adj)return;if(m.path.length>1&&next===m.path.at(-2)){m.path.pop();render();return}if(m.path.includes(next))return;m.path.push(next);if(next===m.goal){answered(m.mistakes===0,`${t('mazeWhy')} ${t('paths')}: ${m.path.length-1}.`)}else render()}
function orbit(d){if(state.game!=='cube')return;const a=state.cube;if(d==='left')a.y-=90;if(d==='right')a.y+=90;if(d==='up')a.x+=90;if(d==='down')a.x-=90;let el=$('#cube-shape');if(el){el.style.setProperty('--rx',a.x+'deg');el.style.setProperty('--ry',a.y+'deg')}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-start],[data-action],[data-lang],[data-choice],[data-orbit],[data-spot],[data-tile],[data-dir]');if(!b)return;if(b.dataset.lang){state.lang=b.dataset.lang;render();return}if(b.dataset.start){start(b.dataset.start);return}if(b.dataset.orbit){orbit(b.dataset.orbit);return}if(b.dataset.choice!==undefined&&state.game==='cube'&&!state.feedback){const c=state.opts[Number(b.dataset.choice)];state.choice=c;answered(c===state.correct,`${t('cubeAns')} ${state.correct}. ${t('cubeWhy')}`);return}if(b.dataset.spot&&state.game==='scene'&&!state.feedback){const c=b.dataset.spot;state.choice=c;answered(c===state.sceneKey,`${t('correctObject')}: ${t(state.sceneKey)}. ${t('sceneWhy')}`);return}if(b.dataset.tile!==undefined&&state.game==='maze'){moveMaze(Number(b.dataset.tile));return}if(b.dataset.dir&&state.game==='maze'){const m=state.maze,k=m.path.at(-1),n=m.n;const dirs={up:-n,down:n,left:-1,right:1};moveMaze(k+dirs[b.dataset.dir]);return}if(b.dataset.action==='motion'){state.reduced=!state.reduced;render();return}if(b.dataset.action==='back'){state.game='';state.feedback=null;render();return}if(b.dataset.action==='replay'){start(state.game);return}if(b.dataset.action==='next'&&state.feedback){state.round++;if(state.round<5)generate();render();return}if(b.dataset.action==='undo'&&state.game==='maze'&&!state.feedback){if(state.maze.path.length>1)state.maze.path.pop();render();return}if(b.dataset.action==='reset'&&state.game==='maze'&&!state.feedback){state.maze.path=[0];state.maze.mistakes++;render();return}});
// Pointer drag for physical 3D cube (passive pointer events; no external library).
let drag=null;app.addEventListener('pointerdown',e=>{if(!e.target.closest('#cube-view'))return;drag={x:e.clientX,y:e.clientY,rx:state.cube.x,ry:state.cube.y,id:e.pointerId};e.target.closest('#cube-view').setPointerCapture(e.pointerId)});app.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;state.cube.y=drag.ry+dx*.65;state.cube.x=Math.max(-450,Math.min(450,drag.rx-dy*.65));const el=$('#cube-shape');if(el){el.style.setProperty('--rx',state.cube.x+'deg');el.style.setProperty('--ry',state.cube.y+'deg')}});app.addEventListener('pointerup',()=>drag=null);app.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('keydown',e=>{if(!state.game||state.feedback)return;const active=document.activeElement;if(['INPUT','TEXTAREA','SELECT'].includes(active?.tagName))return;if(state.game==='cube'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();orbit(e.key.slice(5).toLowerCase())}else if(state.game==='maze'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const m=state.maze,k=m.path.at(-1),n=m.n,d={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1};moveMaze(k+d[e.key])}});
render();
})();
</script>
</body>
