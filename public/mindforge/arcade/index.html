?'#e8ba63':'#75c27e'}"/><path d="M525 398l44-39 67 4 43 32-23 19H550Z" fill="#725879" stroke="#b5a7be" stroke-width="5"/><path d="M596 364V283l${is('boat')?68:0} 0 73 79Z" fill="${is('boat')?'#f3b963':'#fff9e6'}" stroke="#5b7188" stroke-width="7"/><path d="M614 361l-35-70 0 70" fill="#80c4d3"/><path d="M163 159C129 115 141 73 179 67c45-4 58 43 33 87l-21 27Z" fill="${is('balloon')?'#f0bd45':'#ef7a93'}" stroke="#fff6" stroke-width="6"/><path d="M181 171v29m13-29v29" stroke="#fff" stroke-width="5"/><path d="M170 198h35l-7 23h-22Z" fill="#9b6e5a"/><g fill="#f8d08f"><circle cx="76" cy="326" r="10"/><circle cx="114" cy="336" r="6"/><circle cx="450" cy="329" r="10"/><circle cx="486" cy="323" r="8"/></g>`}
const objectName=k=>t(k);const chosenFaceMap={front:'back',back:'front',left:'right',right:'left',top:'bottom',bottom:'top'};
const faceOrder=['front','back','left','right','top','bottom'];
const vectors={front:[0,0,1],back:[0,0,-1],left:[-1,0,0],right:[1,0,0],top:[0,1,0],bottom:[0,-1,0]};
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const eq=(a,b)=>a.every((v,i)=>v===b[i]);
function newMaze(){
 const n=state.mode==='starter'?3:state.mode==='advanced'?5:4;
 const route=[0],steps=shuffle(Array(n-1).fill('R').concat(Array(n-1).fill('D')));
 let row=0,col=0;for(const step of steps){if(step==='R')col++;else row++;route.push(row*n+col)}
 const safe=new Set(route),blocks=[];for(let i=0;i<n*n;i++)if(!safe.has(i)&&Math.random()<(state.mode==='advanced'?.43:.32))blocks.push(i);
 const checkpoints=state.mode==='advanced'?[route[3],route[6]]:[];
 return {n,blocks,goal:n*n-1,path:[0],checkpoints,mistakes:0,optimal:2*(n-1)};
}
function generate(){state.feedback=null;state.choice=null;state.scenePicks=[];
 if(state.game==='cube'){
  state.faces=shuffle(['✦','◆','●','▲','♥','☀']);state.cube={x:-22,y:-30};
  let answerFace;
  if(state.mode==='advanced'){
   const front=faceOrder[Math.floor(Math.random()*faceOrder.length)];
   const adjacent=faceOrder.filter(f=>dot(vectors[f],vectors[front])===0);
   const top=adjacent[Math.floor(Math.random()*adjacent.length)];
   answerFace=faceOrder.find(f=>eq(vectors[f],cross(vectors[top],vectors[front])));
   state.asked=state.faces[faceOrder.indexOf(front)];state.cubeTop=state.faces[faceOrder.indexOf(top)];
  }else{
   const front=faceOrder[Math.floor(Math.random()*faceOrder.length)];
   answerFace=chosenFaceMap[front];state.asked=state.faces[faceOrder.indexOf(front)];state.cubeTop=null;
  }
  state.correct=state.faces[faceOrder.indexOf(answerFace)];
  state.opts=shuffle([state.correct,...shuffle(state.faces.filter(x=>x!==state.correct&&x!==state.asked&&x!==state.cubeTop)).slice(0,state.mode==='starter'?2:3)]);
 }else if(state.game==='scene'){
  state.sceneKeys=shuffle(scenes).slice(0,state.mode==='advanced'?2:1);
  state.sceneKey=state.sceneKeys[0];
 }else if(state.game==='maze'){state.maze=newMaze()}
}
function start(game){state.game=game;state.round=0;state.score=0;state.saved=false;generate();render();window.scrollTo({top:0,behavior:'instant'})}
function stage(content){const round=Math.min(state.round+1,modeRounds());wrap(`<main class="stage"><div class="game-top"><div class="title-area"><button class="btn btn-quiet" type="button" data-action="back">${t('quit')}</button><p class="eyebrow">${t('challenge')} · ${t(state.mode)}</p><h1>${t(state.game)}</h1><p>${t(state.game+'Sub')}</p></div><div class="stats"><span class="stat-pill">${t('round')} <b>${round}/${modeRounds()}</b></span><span class="stat-pill">${t('score')} <b>${state.score}/${modeRounds()}</b></span></div></div><div class="progress-track" role="progressbar" aria-valuenow="${state.round}" aria-valuemax="${modeRounds()}" aria-valuemin="0" aria-label="${t('round')}"><div style="width:${state.round/modeRounds()*100}%"></div></div>${content}</main>`)}
function feedback(){if(!state.feedback)return '';return `<div class="feedback ${state.feedback.ok?'feedback-good':'feedback-try'}" role="status" aria-live="polite"><strong>${state.feedback.ok?'✓ ':'◈ '}${t(state.feedback.ok?'good':'bad')}</strong><div>${state.feedback.text}</div></div><div class="actions"><button class="btn btn-primary" data-action="next">${state.round===modeRounds()-1?t('finish'):t('next')}</button></div>`}
function renderCube(){const labels=['front','back','right','left','top','bottom'];const symbols={front:state.faces[0],back:state.faces[1],left:state.faces[2],right:state.faces[3],top:state.faces[4],bottom:state.faces[5]};const choices=state.opts.map((x,i)=>`<button type="button" class="pick ${state.feedback?(x===state.correct?'correct':x===state.choice?'wrong':''):''}" data-choice="${i}" ${state.feedback?'disabled':''}><span aria-hidden="true">${x}</span><span class="visually-hidden">${x}</span></button>`).join('');const advanced=state.mode==='advanced';const question=advanced?`${t('cubeAdvancedQuestion')} <span class="cube-ref">${state.asked}</span> ${t('cubeAdvancedMiddle')} <span class="cube-ref">${state.cubeTop}</span> ${t('cubeAdvancedEnd')}`:`${t('cubeQuestion')} <span class="cube-ref">${state.asked}</span>?`;stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 01 · 3D · ${t(state.mode)}</p><h2>${question}</h2><p>${advanced?t('cubeAdvancedGuide'):t('cubeGuide')}</p></div><div class="challenge-wrap cube-play"><div><div class="cube-viewport" id="cube-view" aria-label="Interactive 3D cube with six colored faces"><div class="cube-shape" id="cube-shape" style="--rx:${state.cube.x}deg;--ry:${state.cube.y}deg">${labels.map(face=>`<div class="cube-face ${face}"><b>${symbols[face]}</b><small>${face.toUpperCase()}</small></div>`).join('')}</div></div><div class="orbit-controls"><button data-orbit="left" aria-label="Rotate left">↶</button><button data-orbit="up" aria-label="Rotate up">↑</button><button data-orbit="down" aria-label="Rotate down">↓</button><button data-orbit="right" aria-label="Rotate right">↷</button><button data-action="cube-reset" aria-label="Reset cube">⟲</button></div><div class="orbit-hint">${t('orbit')}</div></div><div class="answers"><div class="answer-heading"><h3>${t('challenge')} ${state.round+1}</h3><span class="answer-count">${state.opts.length} ${t('cubeTag')}</span></div><div class="answer-grid">${choices}</div>${feedback()}</div></div></section>`)}
function renderScene(){const hit=state.sceneKeys;const choices=scenes.map(x=>{const [left,top,width,height]=loc[x];const selected=state.scenePicks.includes(x);return `<button class="scene-hit ${state.feedback?(hit.includes(x)?'correct':x===state.choice?'wrong':''):selected?'chosen':''}" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%" data-spot="${x}" aria-label="${objectName(x)}" aria-pressed="${selected}" title="${objectName(x)}" ${state.feedback?'disabled':''}>${selected?'<span aria-hidden="true" class="scene-selected-check">✓</span>':''}</button>`}).join('');const advanced=state.mode==='advanced';stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 02 · ILLUSTRATION · ${t(state.mode)}</p><h2>${advanced?t('sceneMulti'):t('sceneQuestion')}</h2><p>${advanced?t('sceneMultiGuide'):t('sceneGuide')}</p>${advanced?`<p class="scene-counter" role="status">◉ ${t('sceneCount')}: <strong>${state.scenePicks.length}/2</strong></p>`:''}</div><div class="challenge-wrap"><div class="scene-grid"><div class="illustration-panel"><span class="scene-banner">${t('before')}</span><svg viewBox="0 0 800 450" role="img" aria-label="${t('before')}">${sceneSVG(hit,false)}</svg></div><div class="illustration-panel after"><span class="scene-banner">${t('after')}</span><svg viewBox="0 0 800 450" role="img" aria-label="${t('after')}">${sceneSVG(hit,true)}</svg>${choices}</div></div><div class="scene-choicebar" role="group" aria-label="${t('sceneGuide')}">${scenes.map(x=>`<button type="button" class="scene-object-choice ${state.scenePicks.includes(x)?'chosen':''}" data-spot="${x}" aria-pressed="${state.scenePicks.includes(x)}" ${state.feedback?'disabled':''}>${objectName(x)} ${state.scenePicks.includes(x)?'✓':''}</button>`).join('')}</div>${feedback()}</div></section>`)}
function renderMaze(){const {n,blocks,path,goal,checkpoints}=state.maze;const curr=path.at(-1),gems=checkpoints.filter(x=>path.includes(x)).length;const cells=Array.from({length:n*n},(_,i)=>{const wall=blocks.includes(i),visited=path.includes(i),goalHere=i===goal,crystal=checkpoints.includes(i);const classes=[wall?'wall':'',visited?'path':'',goalHere?'goal':'',curr===i?'current':'',crystal?'checkpoint':''].join(' ');const icon=curr===i?'🧑‍🚀':goalHere?'⭐':wall?'🪨':crystal?(visited?'💠':'💎'):visited?'✦':'';return `<button class="maze-tile ${classes}" role="gridcell" data-tile="${i}" ${wall||state.feedback?'disabled':''} aria-label="${state.lang==='vi'?'Ô':'Tile'} ${Math.floor(i/n)+1},${i%n+1}${wall?' blocked':''}${crystal?' crystal':''}" aria-current="${i===curr?'step':'false'}"><span aria-hidden="true">${icon}</span></button>`}).join('');const advanced=state.mode==='advanced';stage(`<section class="game-panel"><div class="panel-head"><p class="eyebrow">WORLD 03 · ISOMETRIC · ${t(state.mode)}</p><h2>${advanced?t('mazeCheckpoint'):t('mazeQuestion')}</h2><p>${advanced?t('mazeAdvancedGuide'):t('mazeGuide')}</p>${advanced?`<p class="scene-counter">💎 ${t('gems')}: <b>${gems}/${checkpoints.length}</b></p>`:''}</div><div class="challenge-wrap"><div class="maze-shell"><div class="maze-stage"><div class="maze-board" role="grid" style="--n:${n}" aria-label="${t('maze')}">${cells}</div></div><div class="maze-legend"><div><strong>${t('paths')}: ${Math.max(0,path.length-1)}</strong><p style="font-size:12px;line-height:1.8">${t('mazeHelp')} ${advanced?'· 💎 '+t('gems'):''}</p><p class="hint">${t('mazeHint')}</p></div><div><div class="movement"><span></span><button data-dir="up" aria-label="Up">↑</button><span></span><button data-dir="left" aria-label="Left">←</button><button data-action="undo" aria-label="Undo">↶</button><button data-dir="right" aria-label="Right">→</button><span></span><button data-dir="down" aria-label="Down">↓</button><span></span></div><button class="btn btn-quiet" data-action="reset">${t('reset')}</button></div></div></div>${feedback()}</div></section>`)}
function result(){if(!state.saved){saveScore(state.game,state.score);state.saved=true}const n=modeRounds(),pct=Math.round(state.score/n*100);stage(`<section class="game-panel reward"><span class="reward-icon" aria-hidden="true">${pct>=80?'🏆':pct>=40?'✨':'🌱'}</span><p class="eyebrow">${t(state.mode)} · ${t(state.game)}</p><h1>${t('resultTitle')}</h1><div class="result-stats"><div><small>${t('score')}</small><strong>${state.score}/${n}</strong></div><div><small>${t('accuracy')}</small><strong>${pct}%</strong></div><div><small>${t('personalBest')}</small><strong>${bestOf(state.game).best}/${n}</strong></div></div><p>${t('noIQ')}</p><div class="actions"><button class="btn btn-primary" data-action="replay">↻ ${t('again')}</button>${state.mode!=='advanced'?`<button class="btn btn-mint" data-action="advance">🚀 ${t('advanceNext')}</button>`:''}<button class="btn" data-action="back">${t('tryMore')} →</button></div></section>`)}
function render(){if(!state.game)return hub();if(state.round>=modeRounds())return result();if(state.game==='cube')renderCube();else if(state.game==='scene')renderScene();else renderMaze()}
function answered(ok,text){state.feedback={ok,text};if(ok)state.score++;render()}
function moveMaze(next){const m=state.maze;if(state.feedback||next<0||next>=m.n*m||m.blocks.includes(next))return;const curr=m.path.at(-1),sameRow=Math.floor(curr/m.n)===Math.floor(next/m.n);const adj=(Math.abs(curr-next)===m.n)||(sameRow&&Math.abs(curr-next)===1);if(!adj)return;
 if(next===m.goal&&!m.checkpoints.every(i=>m.path.includes(i))){const hint=app.querySelector('.maze-legend .hint');if(hint){hint.textContent=t('mazeNeedGems');hint.setAttribute('role','alert')}return}
 if(m.path.length>1&&next===m.path.at(-2)){m.path.pop();render();return}
 m.path.push(next);if(next===m.goal){const efficient=state.mode!=='advanced'||m.path.length-1<=m.optimal*1.5;answered(m.mistakes===0&&efficient,`${t('mazeWhy')} ${t('paths')}: ${m.path.length-1}. ${state.mode==='advanced'?t('efficient')+': '+m.optimal+'.':''}`)}else render()}
function orbit(d){if(state.game!=='cube')return;const a=state.cube;if(d==='left')a.y-=90;if(d==='right')a.y+=90;if(d==='up')a.x+=90;if(d==='down')a.x-=90;let el=$('#cube-shape');if(el){el.style.setProperty('--rx',a.x+'deg');el.style.setProperty('--ry',a.y+'deg')}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-start],[data-action],[data-lang],[data-mode],[data-choice],[data-orbit],[data-spot],[data-tile],[data-dir]');if(!b)return;
 if(b.dataset.lang){state.lang=b.dataset.lang;render();return}
 if(b.dataset.mode){state.mode=b.dataset.mode;try{localStorage.setItem('mindforge-arcade-mode-v2',state.mode)}catch{}render();return}
 if(b.dataset.start){start(b.dataset.start);return}
 if(b.dataset.orbit){orbit(b.dataset.orbit);return}
 if(b.dataset.choice!==undefined&&state.game==='cube'&&!state.feedback){const c=state.opts[Number(b.dataset.choice)];state.choice=c;answered(c===state.correct,`${t('cubeAns')} ${state.correct}. ${state.mode==='advanced'?t('cubeAdvancedWhy'):t('cubeWhy')}`);return}
 if(b.dataset.spot&&state.game==='scene'&&!state.feedback){const c=b.dataset.spot;if(state.scenePicks.includes(c)){state.scenePicks=state.scenePicks.filter(x=>x!==c);render();return}state.scenePicks.push(c);if(!state.sceneKeys.includes(c)){state.choice=c;answered(false,`${t('correctObject')}: ${state.sceneKeys.map(k=>t(k)).join(' + ')}. ${t('sceneWhy')}`)}else if(state.scenePicks.length===state.sceneKeys.length){answered(true,`${t('correctObject')}: ${state.sceneKeys.map(k=>t(k)).join(' + ')}. ${t('sceneWhy')}`)}else render();return}
 if(b.dataset.tile!==undefined&&state.game==='maze'){moveMaze(Number(b.dataset.tile));return}
 if(b.dataset.dir&&state.game==='maze'){const m=state.maze,k=m.path.at(-1),n=m.n;const dirs={up:-n,down:n,left:-1,right:1};moveMaze(k+dirs[b.dataset.dir]);return}
 if(b.dataset.action==='motion'){state.reduced=!state.reduced;render();return}
 if(b.dataset.action==='back'){state.game='';state.feedback=null;render();return}
 if(b.dataset.action==='replay'){start(state.game);return}
 if(b.dataset.action==='advance'){state.mode='advanced';try{localStorage.setItem('mindforge-arcade-mode-v2','advanced')}catch{}start(state.game);return}
 if(b.dataset.action==='cube-reset'){state.cube={x:-22,y:-30};render();return}
 if(b.dataset.action==='next'&&state.feedback){state.round++;if(state.round<modeRounds())generate();render();return}
 if(b.dataset.action==='undo'&&state.game==='maze'&&!state.feedback){if(state.maze.path.length>1)state.maze.path.pop();render();return}
 if(b.dataset.action==='reset'&&state.game==='maze'&&!state.feedback){state.maze.path=[0];state.maze.mistakes++;render();return}
});
// Pointer drag for physical 3D cube (passive pointer events; no external library).
let drag=null;app.addEventListener('pointerdown',e=>{if(!e.target.closest('#cube-view'))return;drag={x:e.clientX,y:e.clientY,rx:state.cube.x,ry:state.cube.y,id:e.pointerId};e.target.closest('#cube-view').setPointerCapture(e.pointerId)});app.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;state.cube.y=drag.ry+dx*.65;state.cube.x=Math.max(-450,Math.min(450,drag.rx-dy*.65));const el=$('#cube-shape');if(el){el.style.setProperty('--rx',state.cube.x+'deg');el.style.setProperty('--ry',state.cube.y+'deg')}});app.addEventListener('pointerup',()=>drag=null);app.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('keydown',e=>{if(!state.game||state.feedback)return;const active=document.activeElement;if(['INPUT','TEXTAREA','SELECT'].includes(active?.tagName))return;if(state.game==='cube'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();orbit(e.key.slice(5).toLowerCase())}else if(state.game==='maze'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const m=state.maze,k=m.path.at(-1),n=m.n,d={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1};moveMaze(k+d[e.key])}});
render();
})();
</script>
